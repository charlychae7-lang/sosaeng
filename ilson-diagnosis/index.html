function visibleTasks(){
  var set=S.org.type;
  var a=lib().filter(function(x){return !x.set||x.set===set;});
  S.custom.forEach(function(c){a.push({id:c.id,g:'doc',name:c.name,app:'auto',lever:'auto',easy:.7,eff:.4,tip:'이 업무가 무엇을 입력받고 무엇을 내보내는지 먼저 한 줄로 정리한 뒤, 양식을 고정하고 자동화 범위를 정합니다.',flag:'',set:'',custom:true});});
  return a;
}
function fm(k){for(var i=0;i<FREQ.length;i++)if(FREQ[i][0]===k)return FREQ[i][2];return 1;}
function calc(){
  var rows=[];
  visibleTasks().forEach(function(t){
    var st=S.tasks[t.id]; if(!st||!st.on)return;
    var hours=(+st.min||0)*fm(st.freq)/60;
    rows.push({t:t,st:st,hours:hours,score:hours*(PAIN[st.pain]||1)*t.easy,save:hours*t.eff});
  });
  rows.sort(function(a,b){return b.score-a.score;});
  var total=0,save=0;rows.forEach(function(r){total+=r.hours;save+=r.save;});
  var by={};
  rows.forEach(function(r){var k=r.t.app;by[k]=by[k]||{app:k,hours:0,score:0,n:0};by[k].hours+=r.hours;by[k].score+=r.score;by[k].n++;});
  var groups=Object.keys(by).map(function(k){return by[k];}).sort(function(a,b){return b.score-a.score;});
  return {rows:rows,total:total,save:save,groups:groups};
}

    h+='<section class="group"><h3>'+GROUPS[g]+'<small>'+items.length+'개 항목</small></h3>';
    items.forEach(function(t){
      var st=S.tasks[t.id]||{on:false,freq:'monthly',min:60,method:'sheet',pain:2};
      var fo=FREQ.map(function(f){return '<option value="'+f[0]+'"'+(st.freq===f[0]?' selected':'')+'>'+f[1]+'</option>';}).join('');
      var mo=METHOD.map(function(m){return '<option value="'+m[0]+'"'+(st.method===m[0]?' selected':'')+'>'+m[1]+'</option>';}).join('');
      var po=[[1,'가끔 불편'],[2,'꽤 불편'],[3,'매우 불편']].map(function(p){return '<option value="'+p[0]+'"'+(+st.pain===p[0]?' selected':'')+'>'+p[1]+'</option>';}).join('');
      var fl=(t.flag.indexOf('p')>=0?'<span class="pill warn">개인정보</span>':'')+(t.flag.indexOf('f')>=0?'<span class="pill warn">금전 기록</span>':'')+(t.flag.indexOf('r')>=0?'<span class="pill warn">상담·종교</span>':'');
      h+='<div class="task'+(st.on?' on':'')+'" data-id="'+t.id+'"><label class="tk"><input type="checkbox" data-f="on"'+(st.on?' checked':'')+'><span class="nm">'+esc(t.name)+fl+'</span></label>'+
      '<div class="det"'+(st.on?'':' hidden')+'><label>횟수<select data-f="freq">'+fo+'</select></label><label>1회 소요(분)<input type="number" data-f="min" min="0" step="5" value="'+(+st.min||0)+'"></label><label>지금 방식<select data-f="method">'+mo+'</select></label><label>불편한 정도<select data-f="pain">'+po+'</select></label></div></div>';
    });
    h+='</section>';
  });
  var cu=S.custom.map(function(c){var st=S.tasks[c.id]||{on:true,freq:'monthly',min:60,method:'sheet',pain:2};
    var fo=FREQ.map(function(f){return '<option value="'+f[0]+'"'+(st.freq===f[0]?' selected':'')+'>'+f[1]+'</option>';}).join('');
    var mo=METHOD.map(function(m){return '<option value="'+m[0]+'"'+(st.method===m[0]?' selected':'')+'>'+m[1]+'</option>';}).join('');
    var po=[[1,'가끔 불편'],[2,'꽤 불편'],[3,'매우 불편']].map(function(p){return '<option value="'+p[0]+'"'+(+st.pain===p[0]?' selected':'')+'>'+p[1]+'</option>';}).join('');
    return '<div class="task on" data-id="'+c.id+'"><label class="tk"><input type="checkbox" data-f="on"'+(st.on?' checked':'')+'><span class="nm">'+esc(c.name)+'<span class="pill lev">직접 추가</span></span></label><div class="det"><label>횟수<select data-f="freq">'+fo+'</select></label><label>1회 소요(분)<input type="number" data-f="min" min="0" step="5" value="'+(+st.min||0)+'"></label><label>지금 방식<select data-f="method">'+mo+'</select></label><label>불편한 정도<select data-f="pain">'+po+'</select></label></div></div>';}).join('');
  h+='<section class="group"><h3>직접 추가한 업무<small>'+S.custom.length+'개</small></h3>'+cu+'<div class="addrow" style="margin-top:10px"><input type="text" id="cu-name" placeholder="목록에 없는 반복 업무를 적어 주세요" autocomplete="off"><button type="button" class="btn sec" data-act="addcustom">추가</button></div></section>';
  return h+navBtns();
}
var Q=[
 {k:'q1',t:'앱을 입력·관리하는 담당자는 몇 명인가요',o:['1명','2~5명','6~20명','21명 이상']},
 {k:'q2',t:'회원·고객이 직접 사용하나요',o:['없음(내부만)','신청·입력만','로그인해 본인 정보 조회']},
 {k:'q3',t:'주로 어떤 기기로 쓰나요',o:['휴대폰 중심','PC 중심','둘 다']},
 {k:'q4',t:'다루는 정보를 모두 골라 주세요',multi:true,o:[['name','이름·연락처'],['addr','주소'],['attend','출결·활동 기록'],['pay','회비·납부 내역'],['rel','상담·종교 관련 기록'],['health','건강정보'],['rrn','주민등록번호'],['bank','금융계좌']]},
 {k:'q5',t:'기존 자료는 어떤 상태인가요',o:['없음','엑셀·시트 있음','종이·문서 있음(입력 필요)']},
 {k:'q6',t:'알림이 필요한가요',o:['불필요','이메일','문자·카톡 발송']},
 {k:'q7',t:'필요한 결과물을 모두 골라 주세요',multi:true,o:[['xls','엑셀 내보내기'],['pdf','PDF·인쇄 양식'],['rep','보고서 초안'],['chart','통계·현황표']]},
 {k:'q8',t:'정해진 양식(보고서·서식)이 있나요',o:['없음','있음(제공 가능)','있음(변경 필요)']}
];
function step2(){
  var h='<h2>앱을 만들기 전에 확인할 것</h2><p class="lead">답에 따라 견적과 계약 조건에서 주의할 점이 아래 진단 결과에 자동으로 붙습니다.</p><div class="panel">';
  Q.forEach(function(q,qi){
    h+='<div class="q"><h3>'+(qi+1)+'. '+q.t+'</h3><div class="opts">';
    q.o.forEach(function(o){
      var v=q.multi?o[0]:o,lab=q.multi?o[1]:o,ch=q.multi?(S.req[q.k]||[]).indexOf(v)>=0:S.req[q.k]===v;
      h+='<label><input type="'+(q.multi?'checkbox':'radio')+'" name="'+q.k+'" data-q="'+q.k+'" value="'+esc(v)+'"'+(ch?' checked':'')+'>'+esc(lab)+'</label>';
    });
    h+='</div></div>';
  });
  h+='<label class="f">상담 메모<textarea id="note">'+esc(S.note)+'</textarea></label></div>';
  return h+navBtns();
}
function step3(){
  var c=calc(),p=plan(c),f=flags(),h='<h2>진단 결과</h2><p class="lead">체크한 업무를 시간·불편도·표준화 난이도로 점수화했습니다. 절감 시간은 가정 효과율로 계산한 추정이며 시범 사용 후 측정으로 확정합니다.</p>';
  if(!c.rows.length)return h+'<div class="panel">2단계에서 반복 업무를 하나 이상 체크하면 결과가 표시됩니다.</div>'+navBtns();
  h+='<div class="tiles"><div class="tile"><div class="v">'+fh(c.total)+'<span class="u"> 시간/월</span></div><div class="u">반복 업무 '+c.rows.length+'건 합계</div></div><div class="tile hl"><div class="v">'+fh(c.save)+'<span class="u"> 시간/월</span></div><div class="u">줄일 수 있는 시간(가정)</div></div><div class="tile"><div class="v">'+Math.min(c.rows.length,3)+'<span class="u"> 건</span></div><div class="u">먼저 손볼 업무</div></div></div>';
  var mx=c.rows[0].score||1;
  h+='<div class="panel"><div class="eyebrow">우선순위</div><div class="tblwrap"><table><thead><tr><th>순위</th><th>업무</th><th class="n">월 시간</th><th>점수</th><th>간소화</th><th>추천 앱</th></tr></thead><tbody>'+
  c.rows.map(function(r,i){return '<tr><td>'+(i+1)+'</td><td>'+esc(r.t.name)+'<div class="tip">'+esc(methodName(r.st.method))+' · '+['','가끔 불편','꽤 불편','매우 불편'][r.st.pain]+'</div></td><td class="n">'+fh(r.hours)+'</td><td><div class="bar"><i style="width:'+Math.round(r.score/mx*100)+'%"></i></div></td><td><span class="pill lev" style="margin:0">'+LEVER[r.t.lever]+'</span></td><td>'+APPS[r.t.app].name+'</td></tr>';}).join('')+'</tbody></table></div></div>';
  h+='<div class="panel"><div class="eyebrow">업무별 간소화 제안</div>'+c.rows.slice(0,8).map(function(r){var mt=METHOD_TIP[r.st.method];return '<div style="margin-bottom:12px"><b>'+esc(r.t.name)+'</b><span class="pill lev">'+LEVER[r.t.lever]+'</span><p class="tip" style="color:var(--ink)">'+esc(r.t.tip)+'</p>'+(mt?'<p class="tip">'+esc(mt)+'</p>':'')+'</div>';}).join('')+'</div>';
  h+='<div class="panel"><div class="eyebrow">추천 제작과 견적(시범가)</div><div class="cards">'+p.items.map(function(i){return '<div class="card"><div class="k">'+i.k+'</div><div class="pr">'+i.name+'</div><div class="pr" style="font-size:15px;color:var(--accent-text)">'+won(i.price)+'</div><p>'+esc(i.desc)+'</p></div>';}).join('')+'</div>'+(p.items.length>1?'<p class="tip">모두 제작하면 합계 '+won(p.sum)+'. 단계별로 나누어 진행할 수 있습니다. 부가세와 외부 서비스 이용료는 별도입니다.</p>':'<p class="tip">부가세와 외부 서비스 이용료는 별도입니다.</p>')+'</div>';
  h+='<div class="panel"><div class="eyebrow">오더 확장 제안</div><div class="cards">'+p.expand.map(function(e){return '<div class="card"><div class="k">'+e.k+'</div><div class="pr" style="font-size:16px">'+e.price+'</div><p>'+esc(e.desc)+'</p></div>';}).join('')+'</div></div>';
  if(f.length)h+='<div class="panel"><div class="eyebrow">주의와 범위 메모</div>'+f.map(function(x){return '<div class="note '+x.lv+'"><b>'+(x.lv==='danger'?'제외 검토':x.lv==='warn'?'주의':'확인')+'</b><span>'+esc(x.tx)+'</span></div>';}).join('')+'</div>';
  var sens=c.rows.filter(function(r){return r.t.flag;});
  if(sens.length)h+='<div class="note warn"><b>개인정보</b><span>개인정보·금전·상담 기록이 포함된 업무가 '+sens.length+'건 있습니다. 최소 수집, 접근 권한, 보관·삭제 절차를 설계한 뒤 제작하세요.</span></div>';
  return h+navBtns();
}
function step4(){
  var t=reportText();
  return '<h2>제안서 초안</h2><p class="lead">진단 결과를 고객에게 보낼 글로 정리했습니다. 복사해서 메신저나 문서에 붙여 넣고 가격과 일정은 확정 후 고치세요.</p><div class="panel"><pre class="rep" id="rep" tabindex="0">'+esc(t)+'</pre><div class="row"><button type="button" class="btn acc" data-act="copy">제안서 복사</button><button type="button" class="btn sec" data-act="save">상담 저장</button></div></div>'+navBtns();
}
function render(){
  renderRail();renderSum();
  var f=[step0,step1,step2,step3,step4][S.step];
  view.innerHTML=f();
  window.scrollTo(0,0);
}

/* ---------- 이벤트 ---------- */
rail.addEventListener('click',function(e){var b=e.target.closest('button[data-step]');if(!b)return;S.step=+b.dataset.step;saveDraft();render();});
view.addEventListener('click',function(e){
  var g=e.target.closest('[data-go]');if(g){S.step=Math.max(0,Math.min(4,S.step+(+g.dataset.go)));saveDraft();render();return;}
  var a=e.target.closest('[data-act]');
  if(a){
    var k=a.dataset.act;
    if(k==='new'){S=blank();saveDraft();render();toast('새 상담을 시작했습니다');}
    else if(k==='sample'){S=sampleState();saveDraft();render();toast('예시를 불러왔습니다');}
    else if(k==='save'){var l=getSaved();var id='s'+Date.now();var copy=JSON.parse(JSON.stringify(S));copy.example=S.example;l.unshift({id:id,name:S.org.name,date:S.org.date,state:copy});if(putSaved(l)){toast('이 기기에 저장했습니다');if(S.step===0)render();}else toast('저장할 수 없는 환경입니다');}
    else if(k==='addcustom'){var inp=document.getElementById('cu-name');var v=inp.value.trim();if(!v)return;var id2='c'+Date.now();S.custom.push({id:id2,name:v});S.tasks[id2]={on:true,freq:'monthly',min:60,method:'sheet',pain:2};saveDraft();render();}
    else if(k==='copy'){var txt=reportText();
      var done=function(){toast('복사했습니다');};
      var fallback=function(){var r=document.getElementById('rep');if(r){var rg=document.createRange();rg.selectNodeContents(r);var sl=window.getSelection();sl.removeAllRanges();sl.addRange(rg);}toast('글을 선택했습니다. 복사(Ctrl+C)해 주세요');};
      try{navigator.clipboard.writeText(txt).then(done,fallback);}catch(err){fallback();}}
    return;
  }
  var ld=e.target.closest('[data-load]');if(ld){var it=getSaved().filter(function(s){return s.id===ld.dataset.load;})[0];if(it){S=it.state;S.step=0;saveDraft();render();toast('불러왔습니다');}return;}
  var dl=e.target.closest('[data-del]');if(dl){putSaved(getSaved().filter(function(s){return s.id!==dl.dataset.del;}));render();}
});
function onField(e){
  var el=e.target,task=el.closest('.task');
  if(task&&el.dataset.f){
    var id=task.dataset.id,st=S.tasks[id]||(S.tasks[id]={on:false,freq:'monthly',min:60,method:'sheet',pain:2});
    var f=el.dataset.f;
    if(f==='on'){st.on=el.checked;task.classList.toggle('on',st.on);var d=task.querySelector('.det');if(d)d.hidden=!st.on;}
    else if(f==='min')st.min=+el.value||0;
    else if(f==='pain')st.pain=+el.value;
    else st[f]=el.value;
    S.example=false;saveDraft();renderSum();return;
  }
  if(el.dataset.q){
    var k=el.dataset.q,q=Q.filter(function(x){return x.k===k;})[0];
    if(q.multi){var arr=[].slice.call(view.querySelectorAll('input[data-q="'+k+'"]:checked')).map(function(i){return i.value;});S.req[k]=arr;}
    else S.req[k]=el.value;
    S.example=false;saveDraft();renderSum();return;
  }
  var m={'o-name':'name','o-type':'type','o-people':'people','o-date':'date','o-owner':'owner'};
  if(m[el.id]){S.org[m[el.id]]=el.value;if(el.id==='o-name'||el.id==='o-type')S.example=false;saveDraft();renderSum();return;}
  if(el.id==='note'){S.note=el.value;saveDraft();}
}
view.addEventListener('input',function(e){if(e.target.type==='text'||e.target.type==='number'||e.target.tagName==='TEXTAREA')onField(e);});
view.addEventListener('change',onField);

S=load();render();
})();
</script>

</body></html>
