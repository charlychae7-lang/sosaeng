<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>잠깐! 진짜? · 연결할 용기 동행 앱</title>
<meta name="description" content="도서 《연결할 용기》와 함께 쓰는 사고 디버깅·사고의 순환 지도 앱. 입력한 글은 이 기기 안에만 저장됩니다.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#EEF2F3; --surface:#FAFCFC; --fg:#13202A; --muted:#566872; --line:#CBD6DA;
  --accent:#0B6E6E; --accent-ink:#fff; --pause:#B8650F; --pause-soft:#F7E8D5; --soft:#DDEAEA;
  --violet:#6C4F86; --violet-soft:#ECE4F2; --green:#3A7660; --green-soft:#E1EFE8;
  --font-display:'Gowun Batang','Nanum Myeongjo',Georgia,serif;
  --font-body:'IBM Plex Sans KR','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1519; --surface:#152028; --fg:#E6EDF0; --muted:#98ABB4; --line:#2A3B45;
  --accent:#5FC7BF; --accent-ink:#06201F; --pause:#F0A55A; --pause-soft:#33271A; --soft:#1B2D33;
  --violet:#C3A7D6; --violet-soft:#2B2234; --green:#8ECAB0; --green-soft:#1C2B25; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1519; --surface:#152028; --fg:#E6EDF0; --muted:#98ABB4; --line:#2A3B45;
  --accent:#5FC7BF; --accent-ink:#06201F; --pause:#F0A55A; --pause-soft:#33271A; --soft:#1B2D33;
  --violet:#C3A7D6; --violet-soft:#2B2234; --green:#8ECAB0; --green-soft:#1C2B25; color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:64px}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.75 var(--font-body);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--font-display);font-weight:700;line-height:1.35;text-wrap:balance;margin:0}
h1{font-size:clamp(32px,7vw,50px);letter-spacing:-.01em}
h2{font-size:clamp(23px,4.5vw,30px)} h3{font-size:19px} p{margin:0}
.wrap{max-width:780px;margin:0 auto;padding:24px 16px 72px}
.lead{color:var(--muted);max-width:60ch}
.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--muted);font-weight:600}
.quote{font-family:var(--font-display);font-size:19px;border-left:3px solid var(--pause);padding-left:14px}
.note{font-size:13px;color:var(--muted)} .hint{font-size:14px;color:var(--muted)}
a{color:var(--accent)}
/* top nav */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .in{max-width:780px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:6px;overflow-x:auto}
.brand{font-family:var(--font-display);font-weight:700;margin-right:auto;white-space:nowrap;color:var(--fg);text-decoration:none}
.top a.tab{white-space:nowrap;text-decoration:none;color:var(--muted);font-size:14px;padding:8px 12px;border-radius:999px;min-height:40px;display:inline-flex;align-items:center}
.top a.tab[aria-current="page"]{background:var(--soft);color:var(--fg);font-weight:600}
/* components */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:clamp(18px,4vw,30px);display:flex;flex-direction:column;gap:22px}
.sec{display:flex;flex-direction:column;gap:10px}
.label{font-size:13px;font-weight:600;color:var(--accent);letter-spacing:.04em}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{appearance:none;font:inherit;font-size:14px;border:1px solid var(--line);background:var(--bg);color:var(--fg);padding:7px 13px;border-radius:999px;cursor:pointer;min-height:40px}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
textarea,input[type=text]{width:100%;font:inherit;font-size:16px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 13px;resize:vertical;line-height:1.6}
textarea{min-height:84px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{appearance:none;font:inherit;font-weight:600;border:0;border-radius:10px;padding:12px 20px;cursor:pointer;background:var(--accent);color:var(--accent-ink);min-height:46px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn.sm{min-height:38px;padding:6px 14px;font-size:14px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row.end{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:640px){.grid2,.grid3{grid-template-columns:1fr}}
.box{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--bg);min-width:0}
.box>b{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.err{background:var(--pause-soft);border-radius:10px;padding:12px 14px;font-size:14px}
.tag{font-size:12px;font-weight:600;background:var(--pause-soft);color:var(--pause);padding:2px 10px;border-radius:999px}
.pat{border:1px solid var(--line);border-radius:10px;padding:14px;background:var(--bg);display:flex;flex-direction:column;gap:6px;text-align:left;font:inherit;color:inherit;cursor:pointer}
.pat[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.pat .nm{font-family:var(--font-display);font-weight:700;font-size:18px}.pat .sm{font-size:14px;color:var(--muted)}
.q{display:flex;flex-direction:column;gap:8px;padding-top:6px}
.qhead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:6px 0}
.steps button{appearance:none;border:0;background:var(--line);height:8px;border-radius:4px;padding:0;cursor:pointer}
.steps button.done{background:var(--accent);opacity:.55}.steps button.cur{background:var(--accent)}
.steps button:disabled{cursor:default}
.flow{display:flex;align-items:center;overflow-x:auto;padding-block:8px}
.flow .n{white-space:nowrap;font-size:13px;color:var(--muted);padding:6px 10px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
.flow .n.on{background:var(--soft);color:var(--fg);border-color:var(--accent)}
.flow .bar{width:14px;height:1px;background:var(--line);flex:none}
.flow .gap{flex:none;margin-inline:8px;padding:6px 14px;border-radius:999px;background:var(--pause-soft);color:var(--pause);font-weight:600;font-size:13px;white-space:nowrap;animation:breathe 3.6s ease-in-out infinite}
@keyframes breathe{50%{margin-inline:16px}}
.final{font-family:var(--font-display);font-size:clamp(21px,5vw,28px);text-align:center;padding:22px 8px;text-wrap:balance}
.final small{display:block;font-family:var(--font-body);font-size:14px;color:var(--muted);margin-top:10px}
.ba{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:640px){.ba{grid-template-columns:1fr}}
.entry{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}@media(max-width:700px){.entry{grid-template-columns:1fr}}
.entry a{display:flex;flex-direction:column;gap:6px;text-decoration:none;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.entry a:hover{border-color:var(--accent)}.entry b{font-family:var(--font-display);font-size:18px}.entry span{font-size:14px;color:var(--muted)}
/* map */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
.seg button{appearance:none;border:0;background:transparent;color:var(--muted);font:inherit;font-size:14px;flex:1 1 auto;padding:9px 14px;cursor:pointer;min-height:40px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.mapbox{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.mapbox svg{display:block;width:100%;height:auto;max-width:520px;margin:0 auto}
.node{cursor:pointer}.node rect{fill:var(--bg);stroke:var(--line);stroke-width:1}
.node text{font:500 16px var(--font-body);fill:var(--fg);text-anchor:middle;pointer-events:none}
.node.sel rect{fill:var(--soft);stroke:var(--accent);stroke-width:2}.node:focus-visible rect{stroke:var(--accent);stroke-width:2}
.detail{border-left:3px solid var(--accent);padding:4px 0 4px 16px;display:flex;flex-direction:column;gap:8px}
.insight{padding:22px 24px;border-radius:14px;background:linear-gradient(165deg,var(--soft),var(--surface));border:1px solid var(--line)}
.insight .formula{font-size:14px;font-weight:600;color:var(--accent);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-top:12px}
details.part{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:0 16px}
details.part summary{cursor:pointer;padding:14px 0;font-family:var(--font-display);font-weight:700;font-size:17px;list-style:none;display:flex;gap:12px;align-items:baseline}
details.part summary::-webkit-details-marker{display:none}
details.part summary .n{color:var(--accent);font-size:14px;min-width:24px}
details.part .bd{padding:0 0 16px;display:flex;flex-direction:column;gap:10px}
.refs{font-size:13px;color:var(--muted)}.refs li{margin-bottom:4px}
.known{background:var(--green-soft)}.open{background:var(--violet-soft)}
.known h3{color:var(--green)}.open h3{color:var(--violet)}
.known,.open{border-radius:12px;padding:16px 18px}.known ul,.open ul{margin:8px 0 0;padding-left:18px;font-size:15px}
/* records */
.rec{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.rec pre{white-space:pre-wrap;font:inherit;font-size:14px;margin:8px 0 0;color:var(--muted)}
.cf{position:sticky;top:56px;z-index:4;margin-bottom:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.cf[hidden]{display:none}

.chip{text-align:left;border-radius:14px;line-height:1.5}
.chip-ch{font-size:12px;color:var(--muted);margin-left:4px}
.chip[aria-pressed="true"] .chip-ch{color:inherit;opacity:.8}
.qchip{width:100%;border-radius:12px}
.seg{flex-wrap:wrap;border-radius:18px}
.gauge{display:flex;flex-direction:column;gap:6px}
.gauge .grow{display:flex;align-items:center;gap:14px}
.gauge input[type=range]{flex:1;min-width:0;accent-color:var(--accent);height:32px}
.gauge output{min-width:3.6em;text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.pause{min-height:62vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;text-align:center;padding-block:24px}
.pause .big{font-family:var(--font-display);font-weight:700;font-size:clamp(46px,16vw,96px);line-height:1.15;color:var(--pause)}
.pause .ring{width:96px;height:96px;border-radius:50%;border:3px solid var(--pause);background:var(--pause-soft);animation:inhale 4s ease-in-out infinite}
@keyframes inhale{50%{transform:scale(1.35);opacity:.6}}
@media(prefers-reduced-motion:reduce){.pause .ring{animation:none}}
.entry{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.loading{display:flex;align-items:center;gap:10px;color:var(--muted);padding:12px 0}
footer{margin-top:34px;font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
@media(prefers-reduced-motion:reduce){.flow .gap{animation:none}*{scroll-behavior:auto!important}}
@media print{.top,.btn,.steps{display:none!important}body{background:#fff}}
</style>
</head>

<nav class="top" aria-label="주 메뉴"><div class="in">

<div class="wrap"><div id="cf" class="err cf" role="alert" hidden></div><main id="view"></main>
<footer>
  <div>《연결할 용기》 채기석 지음 · 퍼플. 이 앱은 책의 내용을 직접 해 보도록 돕는 동행 도구입니다.</div>
  <div>입력한 글은 이 기기의 브라우저 안에만 저장되며 서버로 전송되지 않습니다. (AI 보조를 켠 경우에만 해당 단계의 글이 AI에 전달됩니다.)</div>

</footer></div>

<script>
(function(){
'use strict';
/* =========================================================
   CONFIG — 출판 시 여기만 수정하면 됩니다.
   ========================================================= */
var CONFIG={
  bookTitle:'연결할 용기',
  subtitle:'뿌리에서 미래로 — AI가 비춘 인간, 우리가 다시 설계하는 세계',
  author:'채기석',
  publisher:'퍼플',
  purchaseUrl:'',       // 도서 안내/구매 링크
  aiEndpoint:''         // (선택) 자체 서버 프록시 URL. POST {prompt} → JSON. 비어 있으면 Claude 화면 안에서만 AI가 켜집니다.
};

/* ---------- 책 구조: 《연결할 용기》 ---------- */
var PARTS_BOOK=['프롤로그','제1부 인식의 뿌리','제2부 문명의 뿌리를 다시 묻다','제3부 사고의 순환과 사회적 병리','제4부 통합의 기술','제5부 백캐스팅과 연결 사회의 디자인','제6부 실천 도구 & AI 사고 보조 앱','제7부 & 에필로그'];
/* go: quick | deep | canvas | map:<kind> */
var CHAPTERS=[
 {id:'P',part:0,label:'프롤로그',title:'우리는 정말 세상을 있는 그대로 보고 있는가?',quote:'세상을 바꾸는 것은 새로운 답이 아니라 새로운 질문이다.',
  root:'AI는 정답이 아니라, 내가 얼마나 좁은 질문만 던지며 살아왔는지를 비추는 거울이었다. 분별력이 분별심이 되고 분리의식이 되는 찰나를 알아차리는 것이 이 책의 출발점이다.',
  qs:['오늘 하루 당연하다고 생각했던 것 다섯 가지는 무엇인가요? 각각 왜 당연하다고 믿나요?','그 생각은 내 경험에서 왔나요, 사회가 가르쳐 준 것인가요?','나는 지금 사실을 보고 있나요, 나만의 해석을 보고 있나요?'],
  lab:'오늘 당연하다고 생각한 것 다섯 가지를 적고, 각각 “왜 나는 이것을 당연하다고 믿는가?”를 묻는다.',go:'quick'},
 {id:'1',part:1,label:'1장',title:'우리가 보고 있는 것은 현실일까, 해석일까?',quote:'우리는 세상을 있는 그대로 보는 것이 아니라, 우리가 이해할 수 있는 방식으로 바라본다.',
  root:'세상을 바꾸기 전에 먼저 이해할 것은 세상을 바라보는 나의 사고 메커니즘이다. 인식은 감각수용→감각전달→지각→인지적 처리→반응과 피드백으로 도는 순환이다.',
  qs:['최근 의견이 크게 부딪힌 일에서, 나는 상대가 “틀렸다”고 생각했나요, “다른 렌즈로 보고 있다”고 생각했나요?','매일 접하는 뉴스에서 나는 사실을 보나요, 믿고 싶은 해석만 모으나요?','나는 문제의 진짜 뿌리를 보고 있나요, 결과와 증상만 보고 있나요?'],
  lab:'오늘 시각 차이로 불편했던 상황 하나를 떠올려, 나는 상대를 이해하려 했는지 내 프레임으로 이기려 했는지 솔직히 적어 본다.',go:'map:personal',issue:'갈등과 혐오'},
 {id:'2',part:1,label:'2장',title:'인간의 사고는 왜 쉽게 변하지 않는가 (4개의 벽)',quote:'사람은 새로운 생각을 거부하는 존재가 아니다. 자신의 세계가 무너지는 것을 두려워하는 존재이다.',
  root:'인지적 효율성, 확증편향, 손실 회피, 사회적 동조라는 네 개의 벽은 습관에서 문화, 제도로 이어진다. 변화는 뇌의 작동을 인정하고 좋은 선택이 기본값이 되게 설계하는 데서 시작된다.',
  qs:['“원래 다 이렇게 해”라며 의심 없이 따르는 관행은 무엇인가요?','내 의견과 반대되는 정보나 사람을 만났을 때 귀담아들었나요, 무시했나요?','우리 조직에서 더 좋은 선택이 저절로 이루어지게 바꿀 수 있는 기본값은 무엇인가요?'],
  lab:'고민 하나를 골라 “왜 그런 일이 생기는가?”를 연속해서 다섯 번 물어 본다.',go:'quick'},
 {id:'3',part:1,label:'3장',title:'개념은 어떻게 현실을 가리는가',quote:'사람은 사물을 이해하기 위해 이름을 붙인다. 그러나 이름은 이해를 돕는 동시에 본질을 가리는 틀이 되기도 한다.',
  root:'이름은 이해의 시작일 뿐 본질이 아니다. 문제를 어떻게 이름 붙이느냐가 우리가 상상할 수 있는 해법의 범위를 먼저 정한다. 예: ‘저출산’이라 부르면 출산장려금, ‘삶의 불안정성’이라 부르면 전혀 다른 해법이 보인다.',
  qs:['오늘 누군가를 판단할 때 고유한 결을 보았나요, 직업·나이·이념이라는 이름표로 지레짐작했나요?','우리 조직이나 가정에서 문제 이름을 너무 단순하게 붙여 상류를 놓치고 있는 것은 무엇인가요?','‘학생’, ‘직원’, ‘어르신’이라는 단어 너머의 가능성을 살리려면 어떤 질문이 필요할까요?'],
  lab:'오늘 나/우리/그들/경쟁/협력/원래/절대 같은 말을 얼마나 자주 쓰는지 관찰하고, 연결의 언어인지 분리의 언어인지 물어 본다.',go:'deep',issue:'저출생'},
 {id:'4',part:1,label:'4장',title:'분절된 사고는 어떻게 문명이 되었는가',quote:'분리는 인류를 성장시켰다. 그러나 연결은 인류를 지속가능하게 만든다.',
  root:'분업과 전문화는 문명을 키웠지만 부분만 최적화하고 전체는 병드는 ‘합성의 오류’를 낳았다. 쪼개진 조각을 잇는 ‘연결 설계자’가 미래의 경쟁력이다.',
  qs:['각자의 역할만 다하다가 전체 목적을 놓친 경험이 있나요?','단편적인 부분만 고치려다 다른 부작용을 만든 사례는 무엇인가요?','서로 다른 두 분야나 사람을 연결해 새로운 가치를 만들 수 있는 아이디어가 주변에 있나요?'],
  lab:'성공/실패/능력/가난/교육/공동체를 적고 각 단어 옆에 “반드시 그럴까?”를 달아 본다.',go:'deep'},
 {id:'5',part:2,label:'5장',title:'연결은 새로운 발견이 아니라 원래 존재하던 질서였다',quote:'우리가 잃어버린 것은 연결이 아니라, 연결을 바라보는 시선이다.',
  root:'연결은 새로 발명된 기술이 아니라 본래의 질서다. 단순한 디지털 ‘접속’을 넘어 신뢰와 협력이 흐르는 관계의 ‘온도’를 올리는 것이 과제다.',
  qs:['나는 사람들과 통로만 열린 ‘접속’의 관계인가요, 신뢰가 오가는 ‘연결’의 관계인가요?','단편적인 시각에 갇혀 본래의 연결성을 놓치고 있는 문제는 무엇인가요?','서로 만나지 못해 잠들어 있는 두 자원이나 사람을 잇는다면 무엇이 태어날까요?'],
  lab:'내 주변에서 서로 만나지 못한 두 사람이나 자원을 하나 찾아 이어 줄 방법을 적어 본다.',go:'canvas'},
 {id:'6',part:2,label:'6장',title:'보이지 않는 연결이 세상을 움직인다',quote:'우리는 눈앞의 사건을 보지만, 세상은 보이지 않는 관계에 의해 움직인다.',
  root:'사건은 보이지만 세상을 움직이는 관계는 보이지 않는다. 촘촘한 연결망이 회복탄력성의 비밀이며, 증상만 고치는 시대를 넘어 보이지 않는 관계를 살펴야 한다.',
  qs:['최근 스트레스의 눈앞 사건 뒤에 숨어 있는 보이지 않는 원인(관계)은 무엇인가요?','우리 조직이나 지역이 작은 충격에도 흔들리는 것은 어떤 완충 연결망이 부족해서일까요?','증상 대신 환경과 관계를 돌볼 방법은 무엇인가요?'],
  lab:'',go:'deep'},
 {id:'7',part:2,label:'7장',title:'시스템은 사건을 만들고, 사건은 다시 시스템을 강화한다 (Upstream)',quote:'우리는 불이 난 곳으로 달려간다. 그러나 불이 왜 반복해서 나는지는 좀처럼 묻지 않는다.',
  root:'사건은 강 하류에서 터지지만 미래는 강 상류에서 설계된다. 사람을 탓하기보다 사람이 합리적으로 행동하게 만드는 구조와 기본값을 본다.',
  qs:['매일 바쁘게 물을 퍼내고 있는 ‘하류의 증상’은 무엇인가요?','그 문제가 반복되는 ‘상류’의 무너진 구조나 규칙은 무엇일까요?','문제 발생 자체를 막을 기본값이나 규칙 개혁은 무엇일까요?'],
  lab:'',go:'deep'},
 {id:'8',part:2,label:'8장',title:'시계는 고쳐도 되고, 숲은 함께 살아야 한다',quote:'시계는 부품의 합이지만, 숲은 관계의 합이다.',
  root:'기계는 부품을 갈면 되지만 살아 있는 시스템은 관계망 전체를 돌봐야 산다. 외부 통제는 에너지를 고갈시키고, 신뢰가 만드는 자기조직화가 생명력을 만든다.',
  qs:['내 일터는 사람을 생명체로 대하나요, 교체 가능한 부품으로 대하나요?','문제가 터졌을 때 부품 하나만 바꾸려다 관계와 환경을 놓친 적이 있나요?','외부 지시 없이도 좋은 질서가 생기려면 어떤 신뢰와 자율성이 필요할까요?'],
  lab:'',go:'deep'},
 {id:'9',part:2,label:'9장',title:'전체는 부분의 합보다 크다 (창발과 프레스턴 모델)',quote:'한 사람은 세상을 바꾸기 어렵다. 그러나 연결된 사람들은 새로운 세상을 만든다.',
  root:'창발은 없는 자원을 새로 만드는 것이 아니라 이미 곁에 있던 자원 사이의 연결 고리를 다시 놓는 일에서 시작된다.',
  qs:['내 일터나 공동체는 스펙과 경쟁을 부추기나요, 서로 다른 사람이 만나 가능성을 창발시키나요?','연결되지 않은 채 잠들어 있는 자원이나 사람은 누구인가요?','새 예산 없이 기존 연결 고리를 바꿔 활력을 만들 방안은 무엇인가요?'],
  lab:'',go:'canvas',issue:'지역소멸'},
 {id:'10',part:3,label:'10장',title:'사고는 어떻게 사회의 시스템이 되는가 (재귀 구조)',quote:'인간은 사회를 만들지만, 자신이 만든 사회에 의해 다시 만들어진다.',
  root:'인지적 지름길 → 반복 행동 → 개인 습관 → 집단 규범 → 조직 관행 → 공식 제도화의 6단계로 사고가 시스템이 되고, 시스템은 다시 사고를 만든다. 자동화 자체는 못 벗어나도 성찰의 선순환이 되게 기본값을 설계할 수 있다.',
  qs:['“원래 우리 조직은 그래”라는 행동 중 처음에는 누군가의 편의에서 시작된 것은 무엇인가요?','우리 사회의 법과 제도가 내 사고를 어떤 방향으로 자라게 한다고 느끼나요?','나쁜 관성을 깨고 성찰과 협력이 저절로 일어나게 할 최소한의 장치는 무엇일까요?'],
  lab:'',go:'map:social'},
 {id:'11',part:3,label:'11장',title:'사고의 순환이 만들어내는 4대 사회적 병리',quote:'사회적 병리는 개별 정책의 실수가 아니다. 개인의 합리성이 집단의 비합리성으로 전환되는 사고 순환의 결과다.',
  root:'칸막이 행정, 각자도생, 단기성과주의, 경로의존성은 서로 다른 문제가 아니라 같은 순환이 낳은 공통의 병리다. 사람을 비난하기보다 의사결정의 기본값과 구조를 재설계해야 한다.',
  qs:['‘부서별 최적화’ 때문에 전체가 손해 본 칸막이 경험은 무엇인가요?','단기 성과지표를 채우느라 장기 자산을 잃은 적이 있나요?','불편한 줄 알면서도 QWERTY 자판처럼 고수하는 오랜 습관은 무엇인가요?'],
  lab:'',go:'deep',issue:'갈등과 혐오'},
 {id:'12',part:3,label:'12장',title:'System 2의 두 갈래 길: 폐쇄 순환과 개방 순환',quote:'느린 사고(System 2)는 항상 정직한 판사가 아니다. 때로는 내 신념을 우겨주는 변호사가 되고, 때로는 나를 고치는 성찰의 스위치가 된다.',
  root:'같은 느린 사고도 “내가 맞다”는 전제에서는 합리화의 변호사가 되고, “내가 틀릴 수도 있다”는 전제에서는 성찰의 스위치가 된다. 성찰 다짐만으로는 편향이 줄지 않으니 반대 증거 검토 같은 절차를 구조에 넣어야 한다.',
  qs:['최근 판단에서 “내가 맞다”는 증거만 찾았나요, “틀릴 수도 있다”며 반대 의견을 살폈나요?','우리 조직의 회의에는 반대 증거를 검토하게 하는 장치가 있나요?','AI에게 내 믿음을 강요하는 질문을 하나요, 내 맹점을 찾아 달라는 질문을 하나요?'],
  lab:'',go:'map:closed'},
 {id:'13',part:4,label:'13장',title:'통합적 사고: 코끼리와 다섯 장님',quote:'장님들의 대답은 저마다 참이었다. 문제는 그 다름을 틀림으로 바꾼 분별심과, 전체를 보지 못한 분절된 시야였다.',
  root:'통합적 사고는 모든 것을 아는 것이 아니라 쪼개진 부분들 사이의 관계를 읽는 시선이다. 서로 다른 지혜를 이어 전체 그림을 그리는 통합 설계자가 필요하다.',
  qs:['“내 분야가 아니야”라며 담을 쌓았지만 사실은 내 일과 연결된 것은 무엇인가요?','나와 다른 전문성의 말을 오답으로 배척했나요, 코끼리의 다른 면을 보여 주는 조각으로 받아들였나요?','우리 지역이나 조직의 복잡한 문제 뒤에서 서로 연결되는 서로 다른 세 분야는 무엇인가요?'],
  lab:'',go:'deep'},
 {id:'14',part:4,label:'14장',title:'업스트림 사고와 구조적 설계',quote:'강에 빠진 사람을 건져내는 것도 소중한 용기다. 그러나 더 위대한 지혜는 왜 사람들이 계속 강에 빠지는지를 묻는 것이다.',
  root:'증상을 퍼내는 사람은 평생 소모되지만 상류에서 질문하는 사람은 문제가 반복되지 않는 구조를 디자인한다. 구호보다 강한 것은 시스템의 보이지 않는 규칙과 인센티브다.',
  qs:['매일 처리하는 일 중 당장의 증상만 가라앉히는 ‘하류의 처방’은 무엇인가요?','그 문제가 반복되는 ‘상류’의 구조나 규칙은 무엇일까요?','비난이나 노력 강요 대신 사람들이 저절로 협력하게 만드는 환경 구조는 무엇일까요?'],
  lab:'',go:'deep'},
 {id:'15',part:4,label:'15장',title:'레버리지 포인트 (작은 변화가 세상을 바꾸는 지점)',quote:'세상을 바꾸는 것은 거대한 힘이 아니라, 올바른 지점을 찾는 지혜이다.',
  root:'성과는 노력의 총량이 아니라 레버리지의 정확성이 결정한다. 규칙, 기본값, 목적을 바꾸는 것이 힘이 세고, 가장 깊은 레버리지는 나 자신의 패러다임과 관점의 전환이다.',
  qs:['가장 많은 에너지와 예산을 쓰는 곳이 바닥의 물을 퍼내는 하류는 아닌가요?','예산이나 수치를 조금 조절하는 ‘약한 개입’에 머물고 있지 않나요?','가장 작은 힘으로 선순환을 일깨울 나의 ‘수도꼭지’는 어디에 있을까요?'],
  lab:'',go:'canvas'},
 {id:'16',part:5,label:'16장',title:'예측에서 백캐스팅(Backcasting)으로',quote:'미래는 기다리는 사람의 것이 아니라, 원하는 미래를 먼저 정의하고 거꾸로 오늘을 설계하는 사람의 것이다.',
  root:'현재의 제약과 과거 추세에 매인 예측은 경로의존성을 강화한다. 바라는 미래를 먼저 정의하고 거슬러 올라와 오늘 할 일을 정하는 백캐스팅이 변화의 동력이다.',
  qs:['내 목표는 ‘현재 제약에서 가능한 예측’에서 시작하나요, ‘정말 원하는 미래 비전’에서 시작하나요?','새로운 미래를 그리지 못하게 막는 대표적인 ‘현재의 제약’은 무엇인가요?','10년 뒤 바람직한 모습을 위해 오늘 시작할 가장 작은 변화는 무엇인가요?'],
  lab:'',go:'canvas'},
 {id:'17',part:5,label:'17장',title:'디폴트(기본값) 변경과 레버리지 정책 (Opt-in vs Opt-out)',quote:'사람들의 마음을 억지로 바꾸려 애쓰지 마라. 좋은 선택이 저절로 이루어지도록 환경의 기본값을 바꿔라.',
  root:'마음을 설득하는 호소는 가장 약한 개입이다. 좋은 선택이 저절로 이루어지게 기본값을 바꾸는 것이 가장 강력하다. 단, 기본값만으로 모든 것이 풀리지는 않으며 스스로 생각하는 일과 함께 굴러야 하는 두 바퀴다.',
  qs:['내 회사·학교·가정에서 아무 생각 없이 두면 작동하는 ‘현재의 기본값’은 무엇인가요? (침묵, 경쟁, 소비, 개별 처리…)','마음을 설득하는 대신 좋은 행동이 선택되도록 바꿀 서식이나 절차의 기본값은 무엇일까요?','내가 원하는 삶이 자동으로 실행되도록 환경의 기본값을 바꿀 작은 부분은 무엇인가요?'],
  lab:'',go:'canvas'},
 {id:'18',part:5,label:'18장',title:'AI는 연결 사회의 운영체제(OS)다',quote:'AI는 문명의 두뇌가 아니라, 문명이 서로 대화하고 연결되도록 돕는 신경망이다.',
  root:'AI는 인간을 대체하는 도구가 아니라 사람과 자원의 관계 온도를 높이는 운영체제다. 운영체제는 목적이 없으므로 어떤 가치를 우선해 연결할지는 인간의 철학과 질문에 달려 있다.',
  qs:['AI를 내 일을 대신해 주는 도구로만 쓰나요, 타인과 자원을 이어 주는 연결자로 보나요?','서로 연결되지 못해 가치가 묻힌 두 집단이나 자원은 무엇이며, AI가 어떻게 이어 줄 수 있을까요?','AI가 발달할수록 인간만이 발휘할 신뢰·공감·목적 설정은 어떻게 다듬어질까요?'],
  lab:'',go:'quick',issue:'AI 대전환과 일자리·정체성 상실'},

 ['기억은 현재에 개입한다','개에게 크게 물린 사람에게 현재의 개는 “현재의 개 + 과거의 기억 + 그때의 감정”입니다. 우리는 현재를 경험하면서 과거를 함께 경험합니다.',[12]],

 ['해석이라는 다리','외부 자극 → 감각 → 기억·감정·욕구와의 연결 → 해석 → 생각. 인사를 받지 못한 사실은 하나지만, “무시했나?”와 “못 봤겠지”는 해석의 차이입니다.',[13,14]],
 ['생각·판단·행동의 순환','생각 → 판단 → 선택 → 행동 → 결과 → 새로운 경험 → (다시) 생각. 직선이 아니라 순환입니다.',[]],
 ['생각이 현실을 만드는 방식','“말을 못한다”는 생각이 발표 회피를 낳고, 경험 부족이 불안을 키워 “역시 나는 못해”를 강화합니다. 생각이 행동을 만들고 행동의 결과가 다시 생각을 강화합니다.',[15]],
 ['빠른 사고와 느린 사고','뇌는 에너지를 아끼려 익숙한 상황에서 빠르고 자동적인 시스템 1을 씁니다. “잠깐, 정말 그런가?” 하고 멈추는 것이 시스템 2입니다. 일상의 판단 대부분은 시스템 1이 합니다.',[16,17]],
 ['사고의 구조적 한계','확증편향, 손실회피, 습관, 동조가 개입합니다. 생각 → 근거 선택 → 확신 강화 → 더 강한 생각의 순환이 만들어집니다.',[18,19]],
 ['그 생각은 정말 나의 것인가','내 생각에는 경험, 기억, 감정, 신체 상태와 함께 가족·교육·문화·미디어·제도가 영향을 미쳤을 수 있습니다. “나는 원래 이래”의 “원래”는 어디서 만들어졌을까요.',[20]],
 ['개인의 사고와 사회의 순환','개인의 사고·행동이 반복되어 습관, 집단의 행동, 문화·규범, 제도, 사회 시스템이 되고, 시스템은 다시 환경과 경험으로 개인에게 돌아옵니다. 사회는 인간과 시스템이 서로를 만들어내는 순환 구조입니다.',[21,22,29]],
 ['질문을 바꾸는 것','① 무슨 일이 일어나고 있는가 ② 왜 반복되는가 ③ 어떤 행동이 반복되는가 ④ 그 행동을 만드는 생각은 ⑤ 그 생각을 만든 경험·감정·기억은 ⑥ 그 경험을 만든 환경과 제도는 ⑦ 그 제도를 유지시키는 사고방식은. 질문을 내려가면 표면의 문제에서 구조의 문제로 이동합니다.',[]],
 ['지금까지의 큰 그림','개인 층위와 사회 층위는 사실 같은 그림입니다. 요소가 쌓이면 질적으로 다른 전체가 나타나고, 그 전체가 다시 요소를 바꿉니다. 두 순환이 만나는 자리가 인간입니다.',[]]
];

var aiSample=null,aiChecked=false;
var RULES='당신은 「잠깐! 진짜?」 앱의 사고 파트너입니다. 정답이나 훈계를 주지 않고, 사용자가 자기 생각을 잠시 멈추어 바라보도록 거울 같은 질문을 건넵니다. 순서는 공감 → 사실 확인 → 자동 생각 확인 → 질문 → 대안적 가능성 탐색 → 사용자의 선택입니다. 생각이 틀렸다고 비난하지 않고, 무조건 긍정적으로 생각하라고 강요하지 않습니다. 질문의 전제에 “내가 틀릴 수도 있다”는 열린 가능성을 자연스럽게 담습니다. 사실, 해석, 가능성을 구분하고, 차이를 알아보는 분별력과 우열을 매기는 분별심, 편을 가르는 분리의식을 혼동하지 않습니다. 차분하고 따뜻한 한국어, 짧고 구체적인 문장을 씁니다. 확신 없는 통계 수치와 연도는 쓰지 않고 “대체로” 같은 표현을 씁니다. 특정 정당이나 진영의 편을 들지 않습니다. 반드시 JSON만 출력합니다.';
async function aiAvailable(){
 if(CONFIG.aiEndpoint)return true;
 if(aiChecked)return !!aiSample; aiChecked=true;
 try{aiSample=(window.claude&&window.claude.use)?await window.claude.use('sample'):null}catch(e){aiSample=null}
 return !!aiSample;
}
async function ask(prompt){
 if(CONFIG.aiEndpoint){
  var r=await fetch(CONFIG.aiEndpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:RULES+'\n\n'+prompt})});
  if(!r.ok)throw {code:'fail'}; return await r.json();
 }
 if(!(await aiAvailable()))throw {code:'unavailable'};
 return await aiSample.json(RULES+'\n\n'+prompt,{cache:false,modelTier:'default'});
}
function ctx(){return (S.issue?'사회문제: '+S.issue+'\n':'')+'사용자의 자동적인 생각: '+S.thought}
async function runAI(kind){
 busy=true;errMsg='';render();
 try{
  if(kind==='define'){
   var d=await ask(ctx()+'\n\n이 사회문제를 정의해 주세요. JSON으로만: {"definition":"2~3문장","facts":["확인 가능한 사실 3개"],"causes":["구조적 원인 3개"],"stakeholders":["이해관계자: 걸린 것 (4개)"]}');
   S.f.def=d.definition||'';S.f.facts=(d.facts||[]).join('\n');S.f.causes=(d.causes||[]).join('\n');S.f.stake=(d.stakeholders||[]).join('\n');
  }else if(kind==='mirror'){
   var m=await ask(ctx()+'\n\n이 생각을 대상으로, 먼저 한 문장으로 공감하고, 정답을 주지 말고 사용자의 상황에 맞는 거울 같은 질문 2개만 건네 주세요. 하나는 구체적인 사실(행동)을 되묻고, 하나는 다른 가능성을 열어 줍니다. JSON으로만: {"empathy":"공감 한 문장","questions":["질문1","질문2"]}');
   S.f.mirrorE=m.empathy||'';S.f.mirrorQ=(m.questions||[]).join('\n');
  }else if(kind==='reframe'){
   var f=S.f,r=await ask(ctx()+'\n사용자 답변:\n- 사실/해석: '+(f.q1fact||'')+' / '+(f.q1interp||'')+'\n- 숨은 전제: '+(f.q2||'')+'\n- 생각의 뿌리: '+(f.q3||'')+'\n- 선택: '+(f.q5||'')+'\n의식구조: '+(f.before||'')+'\n\n사용자 자신의 답을 최대한 살려 다시 해석해 주세요. 비어 있는 부분은 억지로 채우지 마세요. JSON으로만: {"after":"새로 열어 볼 해석 한 문장","personal":["개인의 선택지 3개"],"community":["공동체의 선택지 3개"],"keepAsking":"계속 품고 갈 질문 한 개"}');
   S.f.after=r.after||'';S.f.personal=(r.personal||[]).join('\n');S.f.community=(r.community||[]).join('\n');S.f.keep=r.keepAsking||'';
  }
 }catch(e){errMsg=(e&&e.code==='unavailable')?'AI 보조를 사용할 수 없는 환경입니다. 직접 적어 보셔도 충분합니다.':'AI 응답을 받지 못했습니다. 잠시 뒤 다시 시도하거나 직접 적어 주세요.'}
 busy=false;save();render();
}

});
document.addEventListener('change',function(e){
 if(e.target.id!=='imp')return;
 var f=e.target.files[0];if(!f)return;var rd=new FileReader();
 rd.onload=function(){try{var d=JSON.parse(rd.result);if(!Array.isArray(d))throw 0;var have={};DB.records.forEach(function(r){have[r.id]=1});var n=0;d.forEach(function(r){if(r&&r.id&&(r.thought||r.issue)&&!have[r.id]){DB.records.push({id:String(r.id),date:String(r.date||''),issue:String(r.issue||''),thought:String(r.thought||''),source:String(r.source||''),mode:r.mode||'',f:(r.f&&typeof r.f==='object')?r.f:{}});n++}});save();render();say(n+'개의 기록을 불러왔습니다.')}catch(x){say('파일을 읽지 못했습니다. 이 앱에서 내려받은 JSON인지 확인해 주세요.')}};
 rd.readAsText(f);
});
document.addEventListener('keydown',function(e){var n=e.target.closest&&e.target.closest('[data-node]');if(n&&(e.key==='Enter'||e.key===' ')){e.preventDefault();mapSel=+n.dataset.node;render()}});
function chGo(c){
 var g=c.go||'quick';
 if(g==='quick'||g==='deep'){S=DB.draft=blank();S.mode=g;if(c.issue&&g==='deep')S.issue=c.issue;S.source='《'+CONFIG.bookTitle+'》 '+c.label;save();setRoute('debug')}
 else if(g==='canvas')setRoute('canvas');
 else if(g.indexOf('map:')===0){mapKind=g.slice(4);mapSel=0;setRoute('map')}
}
document.addEventListener('click',function(e){
 var lk=e.target.closest('a[href^="#/"]');if(lk){e.preventDefault();setRoute(lk.getAttribute('href').slice(2));return}
 var cf=e.target.closest('[data-cf]');if(cf){var fn=pend;pend=null;$('#cf').hidden=true;if(cf.dataset.cf==='y'&&fn)fn();return}
 var el=e.target.closest('[data-issue],[data-pat],[data-go],[data-act],[data-node],[data-kind],[data-starter],[data-exp],[data-ex],[data-copy],[data-del],[data-resume],[data-ch],[data-bq],[data-bkissue],[data-mode]');
 if(!el)return;var d=el.dataset;
 if(d.mode){if(S.mode!==d.mode){S.mode=d.mode;S.step=0;S.pause=false;save();render()}return}
 if(d.ex!==undefined){var t=$('#thoughtIn');if(t){t.value=d.ex;S.thought=d.ex;save();var g0=$('#go0');if(g0)g0.disabled=false}return}
 if(d.issue!==undefined){S.issue=d.issue;var it=$('#issueIn');if(it)it.value='';document.querySelectorAll('[data-issue]').forEach(function(b){b.setAttribute('aria-pressed',String(b===el))});var g=$('#go0');if(g)g.disabled=!(S.issue&&S.thought.trim().length>3);save();return}
 if(d.pat){var k=S.picked.indexOf(d.pat);if(k>=0)S.picked.splice(k,1);else S.picked.push(d.pat);S.f.before=null;el.setAttribute('aria-pressed',String(k<0));save();return}
 if(d.go!==undefined){var tg=+d.go;if(tg>0&&S.step===0&&!(S.thought.trim().length>3&&(S.mode==='quick'||S.issue.trim())))return;go(tg);return}
 if(d.node!==undefined){mapSel=+d.node;render();return}
 if(d.kind){mapKind=d.kind;mapSel=0;render();return}
 if(d.starter){var a=$('[data-f="after"]');if(a){a.value=(a.value?a.value+'\n':'')+d.starter;S.f.after=a.value;save();a.focus()}return}
 if(d.exp){var x=$('[data-f="action"]');if(x){x.value=d.exp;S.f.action=d.exp;save()}return}
 if(d.copy){var r=DB.records.filter(function(r){return r.id===d.copy})[0];if(r)copy(recText(r),say);return}
 if(d.del){ask2('이 기록을 삭제할까요? 되돌릴 수 없습니다.',function(){DB.records=DB.records.filter(function(r){return r.id!==d.del});save();render()});return}
 if(d.resume){var rr=DB.records.filter(function(r){return r.id===d.resume})[0];if(rr){var m=rr.mode||(rr.f&&(rr.f.pred||rr.f.before)?'deep':'quick');S=DB.draft=Object.assign(blank(),{mode:m,step:m==='quick'?4:5,issue:rr.issue,thought:rr.thought,source:rr.source||'',f:Object.assign({},rr.f)});save();setRoute('debug')}return}
 if(d.ch!==undefined){curCh=+d.ch;var c=CHAPTERS[curCh];if(!bk.w)bk.w='';bk.w=c.label==='프롤로그'||c.label==='에필로그'?c.label:c.label;render();return}
 if(d.bq!==undefined){var q=CHAPTERS[curCh].qs[+d.bq];bk.q=q;var qt=$('#bkQuote');if(qt){qt.value=q;qt.focus()}var c2=CHAPTERS[curCh];if(c2.issue&&!bk.i){bk.i=c2.issue;var bi=$('#bkIssue');if(bi)bi.value=c2.issue;document.querySelectorAll('[data-bkissue]').forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.bkissue===c2.issue))})}return}
 if(d.bkissue){bk.i=d.bkissue;var bi2=$('#bkIssue');if(bi2)bi2.value=d.bkissue;document.querySelectorAll('[data-bkissue]').forEach(function(b){b.setAttribute('aria-pressed',String(b===el))});return}
 var act=d.act;
 if(act==='back'){go(S.mode==='quick'&&S.step===2?0:Math.max(0,S.step-1))}
 else if(act==='next'){
  if(S.step===0&&S.mode==='deep'&&!S.pause){S.pause=true;save();render();window.scrollTo({top:0});return}
  var n=Math.min(steps().length-1,S.step+1);
  if(S.mode==='deep'&&n===5&&S.step===4&&!S.f.after){ask2('새로운 해석을 비워 둔 채로 넘어갈까요?',function(){go(5)});return}
  go(n)}
 else if(act==='pauseGo'){if(S.mode==='quick')go(2);else{S.pause=false;go(1)}}
 else if(act==='toDeep'){S.mode='deep';save();go(0)}
 else if(act==='ai-define')runAI('define');
 else if(act==='ai-mirror')runAI('mirror');
 else if(act==='ai-reframe')runAI('reframe');
 else if(act==='restart'){ask2('지금까지 쓴 내용을 지우고 새로 시작할까요? (저장한 기록은 유지됩니다)',function(){var m=S.mode;S=DB.draft=blank();S.mode=m;save();render();window.scrollTo({top:0})})}
 else if(act==='saveRec'){DB.records.push({id:Date.now().toString(36),date:today(),issue:S.issue,thought:S.thought,source:S.source,mode:S.mode,f:Object.assign({},S.f)});var m2=S.mode;S=DB.draft=blank();S.mode=m2;save();setRoute('notes')}
 else if(act==='mapDebug'){var nd=MAP[mapKind].nodes[mapSel];S.source='지도 · '+nd.n+' — 잠깐! '+nd.q;save();setRoute('debug');go(0)}
 else if(act==='bookGo'){var q2v=$('#bkQuote').value.trim(),iss=$('#bkIssue').value.trim(),w=$('#bkWhere').value.trim();if(!q2v){$('#bkQuote').focus();return}S=DB.draft=blank();S.mode=iss?'deep':'quick';S.thought=q2v;S.issue=iss;S.source='《'+CONFIG.bookTitle+'》'+(w?' '+w:'');save();bk={q:'',w:'',i:''};setRoute('debug')}
 else if(act==='chGo'){chGo(CHAPTERS[curCh])}
 else if(act==='copyCanvas'){copy(canvasText(),function(m){var e2=$('#cvMsg');if(e2)e2.textContent=m},$('#cvMsg'))}
 else if(act==='saveCanvas'){dl('미래설계_'+today()+'.txt',canvasText(),'text/plain').then(function(ok){if(!ok)showText($('#cvMsg'),canvasText())})}
 else if(act==='exportJson'){var jt=JSON.stringify(DB.records,null,2);dl('잠깐진짜_기록_'+today()+'.json',jt,'application/json').then(function(ok){if(!ok)showText($('#notesMsg'),jt)})}
 else if(act==='exportTxt'){var tt=DB.records.map(recText).join('\n\n----------------\n\n');dl('잠깐진짜_기록_'+today()+'.txt',tt,'text/plain').then(function(ok){if(!ok)showText($('#notesMsg'),tt)})}
 else if(act==='importJson')$('#imp').click();
});
render();
})();
</script>
</body>
</html>
