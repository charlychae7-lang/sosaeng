@media print{.top,.btn,.steps{display:none!important}body{background:#fff}}

 '<div class="card">'+chs+'<div class="sec"><span class="label">장 또는 쪽수 (선택)</span><input type="text" id="bkWhere" placeholder="예: 3장, p.84"></div>'+
 '<div class="sec"><span class="label">마음에 걸린 문장</span><textarea id="bkQuote" placeholder="책의 문장이나, 읽고 떠오른 내 생각을 적어 주세요"></textarea></div>'+
 '<div class="sec"><span class="label">이 문장과 닿아 있는 사회문제</span><div class="chips">'+ISSUES.map(function(x){return '<button class="chip" data-bkissue="'+esc(x)+'" aria-pressed="false">'+esc(x)+'</button>'}).join('')+'</div><input type="text" id="bkIssue" placeholder="직접 입력"></div>'+
 '<div class="row end"><span class="note">저작권을 위해 긴 인용은 피하고 한두 문장만 적어 주세요.</span><button class="btn" data-act="bookGo">디버깅으로 가져가기</button></div></div>'+
 '<div class="card" style="margin-top:18px"><h3>읽기 전후 질문</h3><ul class="hint" style="margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px"><li>읽기 전 — 이 주제에 대해 나는 “원래” 어떻게 생각해 왔는가?</li><li>읽는 중 — 어느 문장에서 마음이 불편하거나 반가웠는가?</li><li>읽은 뒤 — 책 때문에 바뀐 것과 바뀌지 않은 것은 무엇인가?</li><li>함께 읽기 — 같은 문장을 다르게 읽은 사람은 누구인가?</li></ul></div>'+
 (CONFIG.purchaseUrl?'<p style="margin-top:16px"><a href="'+esc(CONFIG.purchaseUrl)+'" target="_blank" rel="noopener">'+title+' 안내 보기</a></p>':'');
}

/* ---------- 뷰: 내 기록 ---------- */
function recText(r){var f=r.f||{};return ['[잠깐! 진짜?] 나의 사고 디버깅 기록 ('+r.date+')','사회문제: '+r.issue,'처음 생각: '+r.thought,r.source?'책에서 가져온 문장: '+r.source:'','자동으로 작동하던 틀: '+(f.before||''),'새로 열어 본 해석: '+(f.after||''),'나의 선택: '+(f.q5||''),'계속 품고 갈 질문: '+(f.keep||''),'작은 실험: '+(f.action||''),'예상: '+(f.pred||''),'실제 경험: '+(f.real||''),'새로운 발견: '+(f.found||'')].filter(Boolean).join('\n')}
function vNotes(){
 var rs=DB.records.slice().reverse();
 var list=rs.length?rs.map(function(r){return '<div class="rec"><div class="row end"><b>'+esc(r.issue)+'</b><span class="note">'+esc(r.date)+'</span></div><div class="hint">“'+esc(r.thought)+'”</div><details><summary class="hint" style="cursor:pointer">전체 보기</summary><pre>'+esc(recText(r))+'</pre></details><div class="row"><button class="btn ghost sm" data-copy="'+r.id+'">복사</button><button class="btn ghost sm" data-resume="'+r.id+'">이어 쓰기</button><button class="btn ghost sm" data-del="'+r.id+'">삭제</button></div></div>'}).join(''):'<p class="lead">아직 저장한 기록이 없습니다. 디버깅을 마치면 여기에 모입니다.</p>';
 return '<header class="sec" style="gap:12px;margin-bottom:18px"><div class="eyebrow">내 기록</div><h1>생각이 달라진 자리</h1><p class="lead">이 기기의 브라우저에만 저장됩니다. 브라우저 데이터를 지우면 사라지니 중요한 기록은 내려받아 보관하세요.</p></header>'+
 '<div class="row" style="margin-bottom:14px"><button class="btn ghost sm" data-act="exportJson"'+(rs.length?'':' disabled')+'>JSON 내려받기</button><button class="btn ghost sm" data-act="exportTxt"'+(rs.length?'':' disabled')+'>텍스트 내려받기</button><button class="btn ghost sm" data-act="importJson">불러오기</button><input type="file" id="imp" accept="application/json" hidden></div>'+
 '<div class="sec">'+list+'</div><div class="note" id="notesMsg" style="margin-top:12px" role="status"></div>';
}

/* ---------- 라우팅 / 렌더 ---------- */
function route(){var h=(location.hash||'#/home').replace('#/','');return ['home','debug','map','book','notes'].indexOf(h)>=0?h:'home'}
function render(){
 var r=route();
 document.querySelectorAll('.top a.tab').forEach(function(a){if(a.dataset.r===r)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
 $('#view').innerHTML={home:vHome,debug:vDebug,map:vMap,book:vBook,notes:vNotes}[r]();
 if(r==='debug')aiAvailable().then(function(ok){if(!ok)document.querySelectorAll('[data-ai]').forEach(function(b){b.hidden=true})});
}
function go(n){S.step=n;errMsg='';save();render();window.scrollTo({top:0})}
function dl(name,text,type){var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},500)}
function say(m){var e=$('#notesMsg');if(e)e.textContent=m}
function copy(t,after){(navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(t):Promise.reject()).then(function(){after('복사했습니다.')}).catch(function(){window.prompt('아래 내용을 복사하세요',t)})}
function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}

document.addEventListener('input',function(e){
 var t=e.target;
 if(t.id==='thoughtIn'){S.thought=t.value;save();var g=$('#go0');if(g)g.disabled=!(S.issue.trim()&&S.thought.trim().length>3)}
 else if(t.id==='issueIn'){S.issue=t.value.trim();document.querySelectorAll('[data-issue]').forEach(function(b){b.setAttribute('aria-pressed','false')});save();var g2=$('#go0');if(g2)g2.disabled=!(S.issue&&S.thought.trim().length>3)}
 else if(t.id==='customPat'){S.customPat=t.value;save()}
 else if(t.dataset&&t.dataset.f){S.f[t.dataset.f]=t.value;save()}
});
document.addEventListener('change',function(e){
 if(e.target.id!=='imp')return;
 var f=e.target.files[0];if(!f)return;var rd=new FileReader();
 rd.onload=function(){try{var d=JSON.parse(rd.result);if(!Array.isArray(d))throw 0;var have={};DB.records.forEach(function(r){have[r.id]=1});var n=0;d.forEach(function(r){if(r&&r.id&&r.issue&&!have[r.id]){DB.records.push({id:String(r.id),date:String(r.date||''),issue:String(r.issue),thought:String(r.thought||''),source:String(r.source||''),f:(r.f&&typeof r.f==='object')?r.f:{}});n++}});save();render();say(n+'개의 기록을 불러왔습니다.')}catch(x){say('파일을 읽지 못했습니다. 이 앱에서 내려받은 JSON인지 확인해 주세요.')}};
 rd.readAsText(f);
});
document.addEventListener('keydown',function(e){var n=e.target.closest&&e.target.closest('[data-node]');if(n&&(e.key==='Enter'||e.key===' ')){e.preventDefault();mapSel=+n.dataset.node;render()}});
document.addEventListener('click',function(e){
 var el=e.target.closest('[data-issue],[data-pat],[data-go],[data-act],[data-node],[data-kind],[data-starter],[data-exp],[data-copy],[data-del],[data-resume],[data-ch],[data-bkissue]');
 if(!el)return;var d=el.dataset;
 if(d.issue!==undefined){S.issue=d.issue;var it=$('#issueIn');if(it)it.value='';document.querySelectorAll('[data-issue]').forEach(function(b){b.setAttribute('aria-pressed',String(b===el))});var g=$('#go0');if(g)g.disabled=!(S.issue&&S.thought.trim().length>3);save();return}
 if(d.pat){var k=S.picked.indexOf(d.pat);if(k>=0)S.picked.splice(k,1);else S.picked.push(d.pat);S.f.before=null;el.setAttribute('aria-pressed',String(k<0));save();return}
 if(d.go!==undefined){go(+d.go);return}
 if(d.node!==undefined){mapSel=+d.node;render();return}
 if(d.kind){mapKind=d.kind;mapSel=0;render();return}
 if(d.starter){var a=$('[data-f="after"]');if(a){a.value=(a.value?a.value+'\n':'')+d.starter;S.f.after=a.value;save();a.focus()}return}
 if(d.exp){var x=$('[data-f="action"]');if(x){x.value=d.exp;S.f.action=d.exp;save()}return}
 if(d.copy){var r=DB.records.filter(function(r){return r.id===d.copy})[0];if(r)copy(recText(r),say);return}
 if(d.del){if(confirm('이 기록을 삭제할까요? 되돌릴 수 없습니다.')){DB.records=DB.records.filter(function(r){return r.id!==d.del});save();render()}return}
 if(d.resume){var rr=DB.records.filter(function(r){return r.id===d.resume})[0];if(rr){S=DB.draft=Object.assign(blank(),{step:5,issue:rr.issue,thought:rr.thought,source:rr.source||'',f:Object.assign({},rr.f)});save();location.hash='#/debug';render()}return}
 if(d.ch!==undefined){var c=CONFIG.chapters[+d.ch];$('#bkWhere').value=c.title;if(c.question)$('#bkQuote').placeholder=c.question;if(c.issue)$('#bkIssue').value=c.issue;return}
 if(d.bkissue){$('#bkIssue').value=d.bkissue;document.querySelectorAll('[data-bkissue]').forEach(function(b){b.setAttribute('aria-pressed',String(b===el))});return}
 var act=d.act;
 if(act==='back')go(Math.max(0,S.step-1));
 else if(act==='next'){var n=Math.min(STEPS.length-1,S.step+1);if(n===5&&S.step===4&&!S.f.after&&!confirm('새로운 해석을 비워 둔 채로 넘어갈까요?'))return;go(n)}
 else if(act==='ai-define')runAI('define');
 else if(act==='ai-reframe')runAI('reframe');
 else if(act==='restart'){if(confirm('지금까지 쓴 내용을 지우고 새로 시작할까요? (저장한 기록은 유지됩니다)')){S=DB.draft=blank();save();render();window.scrollTo({top:0})}}
 else if(act==='saveRec'){DB.records.push({id:Date.now().toString(36),date:today(),issue:S.issue,thought:S.thought,source:S.source,f:Object.assign({},S.f)});S=DB.draft=blank();save();location.hash='#/notes'}
 else if(act==='mapDebug'){var nd=MAP[mapKind].nodes[mapSel];S.issue=S.issue||'';S.source=nd.n+' — 잠깐! '+nd.q;save();location.hash='#/debug';go(0)}
 else if(act==='bookGo'){var q=$('#bkQuote').value.trim(),iss=$('#bkIssue').value.trim(),w=$('#bkWhere').value.trim();if(!q){$('#bkQuote').focus();return}S=DB.draft=blank();S.thought=q;S.issue=iss;S.source=(w?w+' · ':'')+(CONFIG.bookTitle?'《'+CONFIG.bookTitle+'》':'책');save();location.hash='#/debug';render()}
 else if(act==='exportJson')dl('잠깐진짜_기록_'+today()+'.json',JSON.stringify(DB.records,null,2),'application/json');
 else if(act==='exportTxt')dl('잠깐진짜_기록_'+today()+'.txt',DB.records.map(recText).join('\n\n----------------\n\n'),'text/plain');
 else if(act==='importJson')$('#imp').click();
});
window.addEventListener('hashchange',function(){render();window.scrollTo({top:0})});
render();
})();
</script>
</body>
</html>
