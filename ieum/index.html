 {n:"치매체크",o:"중앙치매센터",w:"치매 선별 자가 확인과 가까운 치매안심센터 안내 (진단이 아닌 참고용)"},

/* ===== 조합 담당자 수정 구역: 동네 소식·이웃의 지혜 (예시를 실제 내용으로 바꿔 주세요) ===== */

 {d:"이번 달",t:"[예시] 마을 텃밭 함께 가꾸기",x:"상추·고추 모종을 함께 심어요."}
];

];

/* ===== 말하기·듣기 ===== */
function speak(text){
  try{
    if(!("speechSynthesis" in window)){ toast("이 휴대폰에서는 읽어 주기가 안 돼요."); return; }
    window.speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(text); u.lang="ko-KR"; u.rate=0.85;
    window.speechSynthesis.speak(u);
  }catch(e){ toast("읽어 주기가 안 돼요."); }
}
var _sp=[];
function spk(text){ var i=_sp.push(String(text))-1; return '<button class="speak" onclick="speak(_sp['+i+'])">🔊 읽어 주기</button>'; }
function listen(targetId){
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){ voiceGuide(); return; }
  try{
    var r=new SR(); r.lang="ko-KR"; r.interimResults=false;
    toast("말씀하세요. 듣고 있어요…");
    r.onresult=function(e){ var t=e.results[0][0].transcript; var el=document.getElementById(targetId); if(el){ el.value=(el.value?el.value+" ":"")+t; window._draft=el.value; } };
    r.onerror=function(){ voiceGuide(); };
    r.start();
  }catch(e){ voiceGuide(); }
}
function voiceGuide(){
  modal('<h2>🎤 말로 쓰는 방법</h2><p>이 화면에서는 바로 듣기가 안 될 수 있어요. 대신 휴대폰 <b>글자판(키보드)의 마이크</b>를 쓰시면 돼요.</p><ol><li>글 쓰는 칸을 한 번 누르세요. 아래에 글자판이 올라와요.</li><li>글자판 위쪽이나 옆에 있는 <b>🎤 마이크 모양</b>을 누르세요.</li><li>천천히 말씀하시면 글자로 바뀌어요.</li><li>다 말씀하셨으면 마이크를 한 번 더 누르세요.</li></ol><p class="small">마이크가 안 보이면 가족이나 복지관 선생님께 “음성 입력 켜 주세요”라고 부탁하세요.</p>');
}

/* ===== 위험 신호 (알림일 뿐 판단이 아님 — 최종 확인은 담당자) ===== */
function addSignal(level,type,text){
  var t=today();
  if(S.signals.some(function(x){return x.date===t && x.type===type;})) return;
  var d=new Date();
  S.signals.push({id:uid(),date:t,time:p2(d.getHours())+":"+p2(d.getMinutes()),level:level,type:type,text:text,sent:false});
}
function checkSignals(){
  // 1) 오랜만에 앱을 여심 (기기 안에서는 돌아오셨을 때만 알 수 있음)
  var t=today();
  if(S.lastOpen && S.lastOpen<t){
    var gap=Math.round((new Date(t)-new Date(S.lastOpen))/86400000);
    if(gap>=3 && Object.keys(S.openDays).length>=3) addSignal("mid","noopen",gap+"일 동안 앱을 열지 않으셨다가 돌아오심");
  }
  S.lastOpen=t; S.openDays[t]=1;
  // 2) 마음 저조 연속
  if(lowStreak()>=3) addSignal("mid","lowmood","마음 날씨 ‘힘들어요’가 3일 이상 이어짐");
  // 3) 약 체크 끊김 (어제·그제)
  if(S.meds.length){
    var miss=[1,2].every(function(i){ var d=daysAgo(i), log=S.medLog[d]||{}; return S.meds.some(function(m){ return m.created<=d && !log[m.id]; }); });
    var old=S.meds.some(function(m){return m.created<=daysAgo(2);});
    if(miss && old) addSignal("low","med","이틀 이상 약 체크가 비어 있음");
  }

  h+='<div class="card"><h2>✅ 파일럿 시작 전 점검 (Go / No-Go)</h2><ul class="sub" style="padding-left:20px"><li>담당 부서·센터 담당자 1명 이상 지정, 역할·책임 문서화</li><li>위기 알림 확인·연락 시한과 야간·주말 처리 범위 합의</li><li>개인정보 동의서(민감정보)·위탁 계약 법률 검토 완료</li><li>업무 시간이 늘지 않는다는 담당자 확인 (월 요약 1장 이내)</li><li>대화 시간이 아니라 <b>오프라인 참여가 늘지 않으면 중단·재설계</b></li></ul></div>';

  h+='<div class="card"><h2>🧩 지역 자원 등록 (조합 담당자용)</h2><p class="sub">우리 동네 모임·기관 정보를 등록하면 “이웃·도움” 화면에 나타나요.</p><label>이름</label><input id="rname"><label>종류</label><select id="rtype"><option>모임</option><option>프로그램</option><option>역할</option><option>마을</option><option>상담</option><option>돌봄</option></select><label>설명</label><input id="rdesc"><label>관심 태그 (쉼표로 구분: '+esc(INTERESTS.join(", "))+')</label><input id="rtags"><label>문의처</label><input id="rcon"><button onclick="addRes()" style="margin-top:8px">등록하기</button>'+(S.resources.length?'<h3>등록된 자원</h3>'+S.resources.map(function(r){return '<div class="item row"><span style="flex:1">'+esc(r.name)+'</span><button class="ghost sm" onclick="delRes(\''+r.id+'\')">삭제</button></div>';}).join(""):"")+'</div>';

  h+='<div class="card"><h2>💾 내 정보 관리</h2><div class="row"><button class="alt" onclick="exportAll()">내 기록 파일로 저장</button><button class="danger" onclick="wipe()">모두 지우기</button></div><p class="small">이 앱은 서버가 없어요. 모든 기록은 이 휴대폰(브라우저)에만 저장돼요. 브라우저 기록을 지우면 사라질 수 있으니 가끔 파일로 저장해 두세요.</p></div>';
  return h;
}
function policyTable(){
  var rows=[
   ["지역사회 통합돌봄 (돌봄통합지원법, 2026.3 시행)","예방적 서비스(정서·인지 모니터링), 사회적 처방, 공급주체 다양화","사회적연대경제조직(협동조합)으로 공급주체 참여 검토","마음 체크, 이웃 연결, 인계, 이음노트","공급주체 등록 절차·정보공유 조항(지자체 확인)"],
   ["노인맞춤돌봄서비스","생활지원사 방문·안부","방문 전 요약으로 기록 부담 완화","월간 이음노트(B 등급 동의)","수행기관 기록 체계와 연동 가능성"],
   ["고독사 예방사업","고립 위험 조기 발견","연속 저조 신호 → 이웃 모임 연결","마음 연속 저조 알림, 이웃 제안","동의 없는 정보 이용 불가, 대상자 기준 확인"],
   ["노인일자리·시니어클럽 / 노인경제공동체","경험을 활용한 역할·일자리","강점 카드로 역할 후보 제안","강점·경험 카드, 역할 자원 등록","일자리 사업 연계 방식·참여 기준"],
   ["보건소·정신건강복지센터","상담·평가·사례관리","위기 시 사람에게 빠르게 인계","도움 요청(C 등급), 109·129 안내","인계 후 처리 상태 회신 방식"],
   ["건강 증진·치매안심센터","검진·선별 안내","무료 건강 앱·기관 안내로 연결","약·건강 탭의 무료 앱 소개","치료·예방 효과 표현 금지"]
  ];
  return '<div style="overflow-x:auto"><table><tr><th>정책·제도</th><th>핵심 내용</th><th>조합의 역할</th><th>앱 기능</th><th>확인할 것</th></tr>'+rows.map(function(r){return '<tr>'+r.map(function(c){return '<td>'+esc(c)+'</td>';}).join("")+'</tr>';}).join("")+'</table></div>';
}
function makeNote(){
  var from=daysAgo(30), ma=moodAvg(from), ad=medAdherence(30), days=Object.keys(S.moods).filter(function(d){return d>=from;}).length;
  var helps=S.helpLog.filter(function(x){return x.date>=from;}).length;
  var lines=["[월간 이음노트] "+today()+" 기준 최근 30일","대상: "+(S.name||"(이름 미입력)"),"",
   "· 마음 체크: "+days+"일 / 평균 "+(ma==null?"기록 없음":ma.toFixed(1)+" (5점 만점)"),
   "· 복약 체크율: "+(ad==null?"약 미등록":ad+"%"),
   "· 이야기 작성: "+count(S.journal,from)+"개 (내용은 공유되지 않음)",
   "· 이웃 활동 참여 기록: "+count(S.joined,from)+"회",
   "· 도움 요청: "+helps+"건 (C 등급 동의 "+(S.consent.C?"있음":"없음")+")",
   "· 관심 분야(본인 선택): "+(S.interests.join(", ")||"없음"),
   "","※ 본 요약은 본인 동의(B 등급)로 생성된 참고 자료이며 진단·평가가 아닙니다. 판단과 조치는 담당자가 합니다."];
  var txt=lines.join("\n");
  window._note=txt;
  modal('<h2>이음노트</h2><pre>'+esc(txt)+'</pre><div class="row"><button onclick="copyNote()">복사하기</button><button class="alt" onclick="window.print()">인쇄·PDF 저장</button><button class="ghost" onclick="dl(\'이음노트.txt\',window._note,\'text/plain\')">파일로 저장</button></div>');
}
function copyNote(){ try{ navigator.clipboard.writeText(window._note); toast("복사했어요."); }catch(e){ toast("복사가 안 돼요. 글을 길게 눌러 직접 복사해 주세요."); } }
function addRes(){
  var n=v("rname"); if(!n){ toast("이름을 적어 주세요."); return; }
  var tags=v("rtags").split(",").map(function(x){return x.trim();}).filter(function(x){return INTERESTS.indexOf(x)>=0;});
  S.resources.push({id:uid(),type:document.getElementById("rtype").value,name:n,desc:v("rdesc"),tags:tags,contact:v("rcon")||"(문의처 미입력)"});
  save(); render();
}
function delRes(id){ S.resources=S.resources.filter(function(r){return r.id!==id;}); save(); render(); }
function addFamily(){ var t=v("ftext"); if(!t){ toast("남길 말을 적어 주세요."); return; } S.family.push({id:uid(),who:v("fwho")||"가족",t:t}); save(); render(); toast("남겼어요. 소식함에 매일 하나씩 보여 드려요."); }
function delFamily(id){ S.family=S.family.filter(function(f){return f.id!==id;}); save(); render(); }

/* ===== 담당자 화면 ===== */
var STEPS=["접수","연락함","연계함","종결"];
var DB=null, DB_ALERTS=null, DB_NEWS=null, DB_STATE="local";
function alertsList(){ return (DB_ALERTS||S.alerts).slice().sort(function(a,b){ return (a.status==="종결")-(b.status==="종결") || (a.due<b.due?-1:1); }); }
function vStaff(){
  var h='<div class="card"><h2>🖥 담당자 화면 <span class="small">(가칭 통합돌봄센터 · 파일럿)</span></h2>';
  h+='<p class="small">저장 위치: '+(DB_STATE==="shared"?'<b>공유 저장소</b> — 초대된 담당자끼리 같은 목록을 봐요.':'<b>이 기기</b> — 이 기기에서만 보여요.')+' 실명 대신 <b>가명(예: 어르신A)</b>만 쓰세요.</p>';
  h+='<button class="ghost sm" onclick="go(\'ieum\')">← 어르신 화면으로</button></div>';
  var list=alertsList(), now=Date.now(), open=list.filter(function(a){return a.status!=="종결";});
  var over=open.filter(function(a){return a.status==="접수" && now>a.due;}).length;
  h+='<div class="card"><div class="kpi"><div><b>'+open.length+'</b>진행 중</div><div><b style="color:var(--red)">'+over+'</b>확인 시한 지남</div><div><b>'+list.filter(function(a){return a.status==="종결";}).length+'</b>종결</div></div></div>';
  h+='<div class="card"><h2>➕ 신호 접수</h2><p class="sub">어르신 문자(“[이음돌봄 알림]”)를 받으면 여기에 접수하세요. 문자를 통째로 붙여 넣으면 등급을 자동으로 읽어요.</p>';
  h+='<label>가명</label><input id="aname" placeholder="예: 어르신A"><label>받은 문자 또는 내용</label><textarea id="atext" style="min-height:80px" placeholder="[이음돌봄 알림] … 붙여 넣기"></textarea><label>등급</label><select id="alevel"><option value="">자동(문자에서 읽기)</option><option value="high">높음 — 즉시</option><option value="mid">중간 — 24시간</option><option value="low">낮음 — 48시간</option></select><button onclick="addAlert()" style="margin-top:8px">접수하기</button></div>';
  h+='<div class="card"><h2>📋 신호 목록</h2>';
  if(!list.length) h+='<p class="sub">접수된 신호가 없어요.</p>';
  h+=list.map(function(a){
    var lv=LV[a.level]||LV.low, late=a.status==="접수"&&now>a.due;
    var dueTxt=new Date(a.due); dueTxt=p2(dueTxt.getMonth()+1)+"/"+p2(dueTxt.getDate())+" "+p2(dueTxt.getHours())+":"+p2(dueTxt.getMinutes());
    return '<div class="item lv-'+a.level+'" style="padding-left:10px"><b>'+esc(a.name)+'</b> <span class="tag">'+lv.t+' · '+lv.msg+'</span>'+(late?' <span class="tag" style="background:var(--red2);color:var(--red)">시한 지남</span>':'')+'<br><span class="sub" style="white-space:pre-wrap">'+esc(a.text)+'</span><br><span class="small">접수 '+esc(a.recv)+' · 확인 시한 '+dueTxt+'</span><div class="steps">'+STEPS.map(function(sx){return '<button class="'+(a.status===sx?"on":"")+'" onclick="setStep(\''+a.id+'\',\''+sx+'\')">'+sx+'</button>';}).join("")+'</div>'+(a.log&&a.log.length?'<div class="small">'+a.log.map(esc).join(" → ")+'</div>':'')+'<input placeholder="처리 메모 (예: 전화 통화, 복지관 상담 연계)" value="'+esc(a.memo||"")+'" onchange="setMemo(\''+a.id+'\',this.value)"></div>';
  }).join("");
  h+='</div>';
  h+='<div class="card"><h2>📢 동네 소식 올리기</h2><p class="sub">'+(DB_STATE==="shared"?"공유 저장소에 올라가 같은 링크를 보는 분들께 보여요.":"이 기기의 소식함에만 보여요. 모든 어르신께 보이게 하려면 조합에서 앱의 ‘동네 소식’ 목록을 고쳐 다시 게시해야 해요.")+'</p><label>언제</label><input id="nd" placeholder="예: 11월 5일(수) 오후 2시"><label>제목</label><input id="nt"><label>내용</label><input id="nx"><button onclick="addNews()" style="margin-top:8px">올리기</button>'+(S.newsLocal.length?'<h3>올린 소식</h3>'+S.newsLocal.map(function(n){return '<div class="item row"><span style="flex:1">'+esc(n.t)+'</span><button class="ghost sm" onclick="delNews(\''+n.id+'\')">삭제</button></div>';}).join(""):"")+'</div>';
  h+='<div class="card"><h2>📏 운영 원칙</h2><ul class="sub" style="padding-left:20px"><li>앱 신호는 <b>판단이 아니라 알림</b>이에요. 확인·판단·조치는 담당자가 해요.</li><li>확인 시한: 높음 즉시 / 중간 24시간 / 낮음 48시간 (파일럿에서 기관과 합의해 확정)</li><li>야간·주말 처리 범위를 어르신께 미리 알려 드리세요.</li><li>개인정보: 가명 사용, 이야기 원문은 받지 않음, 종결 후 일정 기간 뒤 삭제</li></ul></div>';
  return h;
}
function parseLevel(t){ if(t.indexOf("[높음]")>=0) return "high"; if(t.indexOf("[중간]")>=0) return "mid"; return "low"; }
function addAlert(){
  var name=v("aname")||"이름 미기재", text=v("atext"); if(!text){ toast("내용을 적거나 붙여 넣어 주세요."); return; }
  var lv=document.getElementById("alevel").value||parseLevel(text), d=new Date();
  var a={id:uid(),name:name,text:text,level:lv,recv:p2(d.getMonth()+1)+"/"+p2(d.getDate())+" "+p2(d.getHours())+":"+p2(d.getMinutes()),due:Date.now()+LV[lv].h*3600000,status:"접수",log:["접수 "+p2(d.getHours())+":"+p2(d.getMinutes())],memo:""};
  saveAlert(a,true);
}
function findAlert(id){ return alertsList().filter(function(a){return a.id===id;})[0]; }
function setStep(id,st){ var a=findAlert(id); if(!a||a.status===st) return; a=JSON.parse(JSON.stringify(a)); var d=new Date(); a.status=st; a.log=(a.log||[]).concat([st+" "+p2(d.getHours())+":"+p2(d.getMinutes())]); saveAlert(a,false); }
function setMemo(id,m){ var a=findAlert(id); if(!a) return; a=JSON.parse(JSON.stringify(a)); a.memo=m; saveAlert(a,false); }
function saveAlert(a,isNew){
  if(DB_STATE==="shared" && DB){
    DB.collection("alerts").doc(a.id).set(a).then(function(){ if(isNew) toast("접수했어요."); },function(e){ toast("공유 저장에 실패했어요. 이 기기에 저장할게요."); DB_STATE="local"; saveAlertLocal(a,isNew); });
    return;
  }
  saveAlertLocal(a,isNew);
}
function saveAlertLocal(a,isNew){ var i=S.alerts.findIndex(function(x){return x.id===a.id;}); if(i>=0) S.alerts[i]=a; else S.alerts.push(a); save(); render(); if(isNew) toast("접수했어요."); }
function addNews(){ var t=v("nt"); if(!t){ toast("제목을 적어 주세요."); return; } var n={id:uid(),d:v("nd")||"공지",t:t,x:v("nx")}; if(DB_STATE==="shared"&&DB){ DB.collection("news").doc(n.id).set(n).then(function(){toast("올렸어요.");},function(){toast("공유 저장에 실패했어요.");}); return; } S.newsLocal.unshift(n); save(); render(); toast("올렸어요."); }
function delNews(id){ if(DB_STATE==="shared"&&DB){ DB.collection("news").doc(id).delete(); return; } S.newsLocal=S.newsLocal.filter(function(n){return n.id!==id;}); save(); render(); }
/* 공유 저장소 (claude.ai 링크에서 초대된 담당자에게만 동작; 없으면 이 기기 저장) */
if(window.claude && typeof window.claude.use==="function"){
  window.claude.use("db").then(function(db){
    if(!db) return; DB=db;
    try{
      db.collection("news").onSnapshot(function(snap){ var arr=snap.docs.map(function(d){return d.data();}); S.newsLocal=arr; if(TAB==="news"||TAB==="staff") render(); },function(){});
      db.collection("alerts").onSnapshot(function(snap){ DB_STATE="shared"; DB_ALERTS=snap.docs.map(function(d){return d.data();}); if(TAB==="staff") render(); },function(){ DB_STATE="local"; DB_ALERTS=null; });
    }catch(e){}
  },function(){});
}

function exportAll(){ dl("이음돌봄_내기록.json",JSON.stringify(S,null,1),"application/json"); }
function wipe(){ if(!window._ok){ ask("이 휴대폰에 저장된 모든 기록을 지울까요? 되돌릴 수 없어요.",function(){wipe();}); return; } window._ok=false; { try{localStorage.removeItem(KEY);}catch(e){} load(); render(); } }

load(); checkSignals(); render();
</script>
</body>
</html>
