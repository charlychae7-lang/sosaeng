<!doctype html>
<html lang="ko">

<meta charset="utf-8">
<title>생각은 어떻게 물질이 되는가</title>
<link rel="stylesheet" href="node_modules/@fontsource/noto-sans-kr/korean-400.css">
<link rel="stylesheet" href="node_modules/@fontsource/noto-sans-kr/korean-500.css">
<link rel="stylesheet" href="node_modules/@fontsource/noto-sans-kr/korean-700.css">
<link rel="stylesheet" href="node_modules/@fontsource/noto-sans-kr/latin-400.css">
<link rel="stylesheet" href="node_modules/@fontsource/noto-sans-kr/latin-500.css">
<link rel="stylesheet" href="node_modules/@fontsource/noto-sans-kr/latin-700.css">
<link rel="stylesheet" href="node_modules/@fontsource/gowun-batang/korean-700.css">
<link rel="stylesheet" href="node_modules/@fontsource/gowun-batang/latin-700.css">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
/* =====================================================================
   생각은 어떻게 물질이 되는가 — 모션그래픽 (1920×1080, 30fps)
   모든 장면은 시간 t(초)만으로 그려지는 순수 함수라서, 프레임을 임의의 순서로 뽑아도 같은 화면이 나옵니다.
   내용 출처: 《연결할 용기》 / 잠깐! 진짜? 앱 「책과 함께 · 깊이 읽기」
   ===================================================================== */
const W=1920,H=1080,cv=document.getElementById('c'),ctx=cv.getContext('2d');
const DURATION=95;
const SANS="'Noto Sans KR',sans-serif", SERIF="'Gowun Batang','Noto Sans KR',serif";
const C={bg1:'#06100f',bg2:'#0c2428',fg:'#EAF2F3',mut:'#9FB6BC',teal:'#5FC7BF',amber:'#F0A55A',violet:'#B3A4F0',green:'#8ECAB0',rose:'#F28FA0',blue:'#6EB4F0',line:'#2B4A52',white:'#FFFFFF'};

/* ---------- 유틸 ---------- */
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const eio=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const eo=t=>1-Math.pow(1-t,3);
const P=(t,a,b)=>clamp((t-a)/(b-a));
const E=(t,a,b)=>eio(P(t,a,b));
const O=(t,a,b)=>eo(P(t,a,b));
const win=(t,a,b,c,d)=>P(t,a,b)*(1-P(t,c,d));
const TAU=Math.PI*2;
function rng(seed){let s=seed>>>0;return()=>{s=(s+0x6D2B79F5)>>>0;let t=s;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
function hex(c,a=1){const n=parseInt(c.slice(1),16);return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`}
function dot(x,y,r,col,a=1){ctx.fillStyle=hex(col,a);ctx.beginPath();ctx.arc(x,y,Math.max(0,r),0,TAU);ctx.fill()}
function ring(x,y,r,col,a=1,w=2){ctx.strokeStyle=hex(col,a);ctx.lineWidth=w;ctx.beginPath();ctx.arc(x,y,Math.max(0,r),0,TAU);ctx.stroke()}
function glow(x,y,r,col,a=1){if(r<=0||a<=0)return;const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,hex(col,a));g.addColorStop(1,hex(col,0));ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill()}
function line(x1,y1,x2,y2,col,a=1,w=2,cap='round'){ctx.strokeStyle=hex(col,a);ctx.lineWidth=w;ctx.lineCap=cap;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()}
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
function text(s,x,y,o={}){const{size=44,w=500,col=C.fg,a=1,align='center',font=SANS,ls=0}=o;ctx.font=`${w} ${size}px ${font}`;ctx.textAlign=align;ctx.textBaseline='middle';ctx.letterSpacing=ls?ls+'px':'0px';ctx.fillStyle=hex(col,a);ctx.fillText(s,x,y)}
function tw(s,size,w=500,font=SANS){ctx.font=`${w} ${size}px ${font}`;ctx.letterSpacing='0px';return ctx.measureText(s).width}
function pill(x,y,w,h,col,a,label,sub,hl=0,fs=34){
  ctx.save();ctx.globalAlpha=a;
  if(hl>0)glow(x,y,w*.7,col,.25*hl);
  rr(x-w/2,y-h/2,w,h,h/2);ctx.fillStyle=hex(col,.14+.2*hl);ctx.fill();
  ctx.strokeStyle=hex(col,.65+.35*hl);ctx.lineWidth=2+2*hl;ctx.stroke();
  text(label,x,y-(sub?12:0),{size:fs,w:700});
  if(sub)text(sub,x,y+(fs>30?26:22),{size:fs>30?22:18,col:C.mut});
  ctx.restore();
}
function person(x,y,s,col,a,swing=0,carry=false){ // (x,y)=발 위치
  ctx.save();ctx.globalAlpha=a;ctx.strokeStyle=hex(col,1);ctx.fillStyle=hex(col,1);ctx.lineWidth=6*s;ctx.lineCap='round';
  const hy=y-86*s;
  ctx.beginPath();ctx.arc(x,hy,15*s,0,TAU);ctx.fill();
  ctx.beginPath();ctx.moveTo(x,hy+18*s);ctx.lineTo(x,y-34*s);ctx.stroke();            // 몸
  const sw=Math.sin(swing)*14*s;
  ctx.beginPath();ctx.moveTo(x,y-34*s);ctx.lineTo(x-12*s+sw,y);ctx.moveTo(x,y-34*s);ctx.lineTo(x+12*s-sw,y);ctx.stroke(); // 다리
  ctx.beginPath();ctx.moveTo(x,hy+30*s);
  if(carry){ctx.lineTo(x+22*s,hy+10*s);ctx.moveTo(x,hy+30*s);ctx.lineTo(x+10*s,hy+2*s)}else{ctx.lineTo(x-20*s-sw,y-46*s);ctx.moveTo(x,hy+30*s);ctx.lineTo(x+20*s+sw,y-46*s)}
  ctx.stroke();ctx.restore();
}

/* ---------- 사전 생성 ---------- */
const R1=rng(7);
const STARS=Array.from({length:90},()=>({x:R1()*W,y:R1()*H,r:.6+R1()*1.6,a:.25+R1()*.6,v:2+R1()*6,p:R1()*6}));
// 신경세포(수상돌기)
const DEN=(()=>{const r=rng(21),segs=[];function br(x,y,ang,len,depth,order){if(depth>3)return;const x2=x+Math.cos(ang)*len,y2=y+Math.sin(ang)*len;segs.push({x1:x,y1:y,x2,y2,order,w:depth===0?7:depth===1?5:3});const n=depth<2?2:2;for(let i=0;i<n;i++)br(x2,y2,ang+(i?1:-1)*(.35+r()*.5),len*(.68+r()*.1),depth+1,order+1)}
  [[Math.PI,110],[Math.PI*0.78,105],[Math.PI*1.22,105],[Math.PI*0.58,95],[Math.PI*1.42,95]].forEach(([a,l])=>br(520+Math.cos(a)*66,470+Math.sin(a)*66,a,l,0,0));return segs})();
// 머리 윤곽(옆모습)과 신경망
const HEAD=(()=>{const p=[[860,790],[826,690],[796,600],[800,500],[830,400],[890,320],[980,270],[1090,262],[1170,300],[1214,372],[1226,452],[1252,500],[1226,520],[1236,560],[1222,610],[1190,650],[1130,672],[1088,704],[1070,760],[1064,800]];
  const path=new Path2D();path.moveTo((p[0][0]+p[1][0])/2,(p[0][1]+p[1][1])/2);for(let i=1;i<p.length-1;i++){const m=[(p[i][0]+p[i+1][0])/2,(p[i][1]+p[i+1][1])/2];path.quadraticCurveTo(p[i][0],p[i][1],m[0],m[1])}
  const poly=new Path2D();poly.moveTo(p[0][0],p[0][1]);p.forEach(q=>poly.lineTo(q[0],q[1]));poly.closePath();
  const r=rng(33),nodes=[];let guard=0;while(nodes.length<96&&guard++<5000){const x=820+r()*430,y=270+r()*400;if(ctx.isPointInPath(poly,x,y)&&y<660&&x>835){if(nodes.every(n=>Math.hypot(n.x-x,n.y-y)>46))nodes.push({x,y,p:r()*6,s:.8+r()*1.4})}}
  const links=[];for(let i=0;i<nodes.length;i++)for(let j=i+1;j<nodes.length;j++){const d=Math.hypot(nodes[i].x-nodes[j].x,nodes[i].y-nodes[j].y);if(d<104)links.push([i,j,d])}
  return{path,nodes,links}})();
// S1 분자 군집(세포막으로 모이는 장면)
const MOL=(()=>{const r=rng(55),a=[];for(let i=0;i<64;i++){const ang=i/64*TAU;a.push({sx:80+r()*1760,sy:120+r()*760,ex:960+Math.cos(ang)*220,ey:470+Math.sin(ang)*220,rot:r()*TAU,d:r()*.5})}return a})();
// S2 세포 내부 입자
const CELLP=(()=>{const r=rng(77),a=[];for(let i=0;i<26;i++)a.push({ang:r()*TAU,ph:r(),sp:.18+r()*.2,col:i%3?C.teal:C.amber});return a})();
// S4 이웃 건물
const CITY=[{x:360,w:130,h:210,c:C.blue,d:0},{x:520,w:110,h:300,c:C.violet,d:.25},{x:690,w:120,h:160,c:C.green,d:.5},{x:1420,w:130,h:240,c:C.blue,d:.15},{x:1580,w:120,h:330,c:C.violet,d:.4},{x:1740,w:110,h:180,c:C.green,d:.65}];

/* ---------- 배경·공통 ---------- */
function bg(t){
  const g=ctx.createLinearGradient(0,0,W,H);g.addColorStop(0,C.bg1);g.addColorStop(1,C.bg2);ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  for(const s of STARS){const a=(.5+.5*Math.sin(t*.9+s.p))*s.a*.55;ctx.fillStyle=`rgba(190,225,235,${a})`;ctx.beginPath();ctx.arc(s.x,(s.y+t*s.v)%H,s.r,0,TAU);ctx.fill()}
}
const SCENES=[ // [시작, 끝, 라벨]
  [0,5.5,''],[5.5,19,'① 물질'],[19,34,'② 생명과 신경계'],[34,47,'③ 경험이 생각이 되는 과정'],[47,69,'④ 생각이 물질이 되는 길'],[69,78,'⑤ 순환'],[78,88,''],[88,95,'']];
function sa(t,i){const[a,b]=SCENES[i];const fi=i===0?0:.9,fo=i===7?1.2:.9;return P(t,a,a+(fi||.001))*(1-P(t,b-fo,b))}
function chip(t){
  for(let i=1;i<=5;i++){const[a,b,l]=SCENES[i];const al=win(t,a+.2,a+1.2,b-1.2,b-.2);if(al<=0)continue;
    ctx.save();ctx.globalAlpha=al;const w=tw(l,30,700)+64;rr(70,56,w,56,28);ctx.fillStyle='rgba(95,199,191,.14)';ctx.fill();ctx.strokeStyle='rgba(95,199,191,.55)';ctx.lineWidth=2;ctx.stroke();dot(98,84,6,C.teal);text(l,118,85,{size:30,w:700,align:'left',col:C.fg});ctx.restore()}
}
const CAPS=[
 [5.8,9.2,['물질은 단단한 덩어리가 아니라 관계로 이루어진 구조입니다.','현대 물리학은 입자를 ‘장의 들뜬 상태’로 보기도 합니다.']],
 [9.6,12.4,['입자가 모여 원자를, 원자가 모여 분자를 이룹니다.']],
 [12.8,16.5,['수소와 산소는 물과 전혀 다른 성질을 가졌지만,','결합하면 물이 됩니다. 전체는 부분의 합과 다릅니다 — 창발']],
 [16.9,18.9,['창발이 쌓이며 물질은 점점 더 복잡한 조직이 됩니다.']],
 [19.4,22.5,['분자들이 조직되어 세포가 됩니다.','생명의 시작은 아직 열린 연구 주제입니다.']],
 [22.9,26.8,['정보를 전달하는 데 특화된 세포, 신경세포(뉴런).','세포 안에서는 전기 신호가 흐릅니다.']],
 [27.2,30.2,['세포와 세포 사이에서는','화학 신호(신경전달물질)가 건너갑니다.']],
 [30.6,32.4,['세포 → 신경세포 → 신경망 → 뇌','물질의 세계가 ‘정보의 세계’로 넘어갑니다.']],
 [32.6,33.8,['생각은 화학물질 하나가 아니라, 뇌와 몸, 기억과 환경이','함께 만드는 과정입니다.']],
 [34.6,38.4,['외부 자극은 그대로 사실로 기록되지 않습니다.','과거의 기억·감정·욕구와 먼저 섞입니다.']],
 [38.8,43.0,['같은 비가 아이에게는 놀이, 농부에게는 안도,','신랑에게는 걱정이 됩니다.']],
 [43.3,46.8,['사실과 생각 사이에는 ‘해석’이 있고,','여기가 생각의 틈을 만들 수 있는 자리입니다.']],
 [47.6,50.5,['생각은 눈에 보이지 않지만','판단과 선택을 거쳐 행동이 됩니다.']],
 [50.9,53.3,['생각을 따라 몸이 움직이면','세상에 첫 번째 흔적이 남습니다.']],
 [53.6,56.1,['같은 행동이 반복되면 습관이 됩니다.']],
 [56.4,59.1,['습관을 공유하는 사람들이 모이면','집단의 행동이 됩니다.']],
 [59.4,63.5,['집단의 행동은 문화와 규범이 되고,','조직의 관행과 제도로 굳어집니다.']],
 [63.8,68.8,['마침내 건물과 도시, 환경이라는','눈에 보이는 물질의 모습으로 남습니다.']],
 [69.5,73.6,['환경은 다시 사람의 경험과 마음, 생각을 만듭니다.']],
 [73.9,77.6,['사람이 시스템을 만들고, 시스템이 다시 사람을 만드는 순환.']]
];
function caption(t){
  for(const[a,b,lines]of CAPS){if(t<a||t>=b)continue;const al=P(t,a,a+.5)*(1-P(t,b-.5,b));
    const size=42,lh=62;let mw=0;for(const l of lines)mw=Math.max(mw,tw(l,size,500));
    const bw=mw+110,bh=lines.length*lh+30,x=W/2-bw/2,y=H-84-bh+lines.length*0;
    ctx.save();ctx.globalAlpha=al;rr(x,y,bw,bh,28);ctx.fillStyle='rgba(4,14,16,.62)';ctx.fill();ctx.strokeStyle='rgba(95,199,191,.25)';ctx.lineWidth=1.5;ctx.stroke();
    lines.forEach((l,i)=>text(l,W/2,y+15+lh*(i+.5),{size,w:500,col:C.fg}));ctx.restore();return}
}
function progress(t){ctx.fillStyle='rgba(95,199,191,.16)';ctx.fillRect(0,H-6,W,6);ctx.fillStyle=hex(C.teal,.85);ctx.fillRect(0,H-6,W*clamp(t/DURATION),6)}
function brand(t){const a=.55*win(t,6,7,86,88);if(a<=0)return;text('잠깐! 진짜?  ·  《연결할 용기》',W-70,64,{size:24,col:C.mut,a,align:'right'})}

/* ---------- S0 제목 ---------- */
function S0(t,A){
  ctx.save();ctx.globalAlpha=A;
  const cx=960,cy=440;
  const g=glow;g(cx,cy,520,C.teal,.10*P(t,0,2));
  for(let i=0;i<150;i++){const r=rng(900+i),ang=r()*TAU,rad=260+r()*520,spd=(r()-.5)*.25;const k=eo(P(t,0,3.2));const a2=ang+t*spd,rr2=lerp(rad*2.2,rad,k);
    const x=cx+Math.cos(a2)*rr2*1.2,y=cy+Math.sin(a2)*rr2*.62;dot(x,y,1.2+r()*2.6,i%4?C.teal:C.amber,.15+.5*k*r())}
  const ta=O(t,1.2,2.6)*(1-P(t,4.7,5.4));
  text('생각은 어떻게',cx,cy-70,{size:96,w:700,font:SERIF,a:ta});
  text('물질이 되는가',cx,cy+50,{size:96,w:700,font:SERIF,a:ta,col:C.teal});
  const sb=O(t,2.4,3.6)*(1-P(t,4.7,5.4));
  text('물질에서 생각으로, 생각에서 다시 세상으로',cx,cy+190,{size:40,col:C.mut,a:sb});
  const sc=O(t,3,4.2)*(1-P(t,4.7,5.4));
  text('잠깐! 진짜?  ·  《연결할 용기》 동행 앱 — 사고의 순환 지도',cx,cy+270,{size:28,col:C.mut,a:sc*.8});
  ctx.restore();
}

/* ---------- S1 물질 ---------- */
function S1(t,A){
  ctx.save();ctx.globalAlpha=A;const cx=960,cy=470;
  // a. 양자장
  const fa=win(t,5.6,6.6,9.2,10.2);
  if(fa>0){
    const cols=46,rows=24,sx=36,sy=34,x0=cx-(cols-1)*sx/2,y0=cy-(rows-1)*sy/2,bt=P(t,7,9.2);
    for(let j=0;j<rows;j++)for(let i=0;i<cols;i++){const x=x0+i*sx,y=y0+j*sy,d=Math.hypot(x-cx,y-cy);
      const wave=Math.sin(d*.02-t*3.2)*Math.exp(-d*.0018)*(1-.55*bt)*9;
      const bump=Math.exp(-(d*d)/(2*Math.pow(90-55*bt,2)))*48*bt*(1+.12*Math.sin(t*7));
      const ang=Math.atan2(y-cy,x-cx);const px=x+Math.cos(ang)*wave*.5,py=y+Math.sin(ang)*wave*.5-bump;
      const br=clamp(.2+Math.abs(wave)/16+bump/48,0,1);dot(px,py,2+br*3.4,C.teal,fa*(.22+.7*br))}
    for(let k=0;k<3;k++){const rt=((t*.55+k/3)%1);ctx.strokeStyle=hex(C.teal,fa*bt*(1-rt)*.5);ctx.lineWidth=2.2;ctx.beginPath();ctx.ellipse(cx,cy-22,60+rt*300,(60+rt*300)*.4,0,0,TAU);ctx.stroke()}
    glow(cx,cy-40*bt,100*bt+14,C.teal,fa*(.25+.7*bt));dot(cx,cy-44*bt,8+10*bt,C.white,fa*bt);
    text('양자장',cx,150,{size:60,w:700,font:SERIF,a:fa});text('입자는 장이 들뜬 상태',cx,222,{size:32,col:C.mut,a:fa*P(t,7.6,8.6)});
  }
  // b. 원자
  const fb=win(t,9.3,10.3,12.5,13.3);
  if(fb>0){const s=.55+.45*O(t,9.3,11);
    glow(cx,cy,260*s,C.amber,.12*fb);
    const nu=[[0,0],[18,6],[-16,10],[8,-18],[-10,-14],[20,-12],[-22,-4]];nu.forEach((p,i)=>{dot(cx+p[0]*s*1.3,cy+p[1]*s*1.3,13*s,i%2?C.rose:C.amber,fb);glow(cx+p[0]*s*1.3,cy+p[1]*s*1.3,26*s,i%2?C.rose:C.amber,.3*fb)});
    for(let i=0;i<3;i++){const rot=i*Math.PI/3+t*.15;ctx.save();ctx.translate(cx,cy);ctx.rotate(rot);ctx.strokeStyle=hex(C.teal,.45*fb);ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(0,0,230*s,80*s,0,0,TAU);ctx.stroke();
      const a=t*(2.2+i*.5)+i*2;const ex=Math.cos(a)*230*s,ey=Math.sin(a)*80*s;glow(ex,ey,30,C.teal,.6*fb);dot(ex,ey,9,C.white,fb);ctx.restore()}
    text('원자',cx,150,{size:60,w:700,font:SERIF,a:fb});text('핵과 전자 — 모두 상호작용하는 구조',cx,222,{size:32,col:C.mut,a:fb});
  }
  // c. 분자와 창발
  const fc=win(t,12.4,13.4,16.2,17.0);
  if(fc>0){const k=E(t,12.9,14.6);const Ox=cx,Oy=cy+30;

  const rp=win(t,53.6,54.2,55.8,56.4);if(rp>0){ctx.save();ctx.globalAlpha=A*rp;const rx=860,ry=GY-90;ctx.strokeStyle=hex(C.rose,.9);ctx.lineWidth=5;ctx.beginPath();ctx.arc(rx,ry-120,60,-1,4.4);ctx.stroke();const ea=4.4;ctx.fillStyle=hex(C.rose,.95);ctx.beginPath();ctx.moveTo(rx+Math.cos(ea)*60,ry-120+Math.sin(ea)*60);ctx.lineTo(rx+Math.cos(ea)*60+18,ry-120+Math.sin(ea)*60-14);ctx.lineTo(rx+Math.cos(ea)*60-8,ry-120+Math.sin(ea)*60-22);ctx.fill();text('×'+(1+Math.floor((t-53.6)*3)),rx,ry-120,{size:34,w:700,col:C.rose});ctx.restore()}
  // 단계 4: 문화·규범·제도 아이콘
  const cu=P(t,59.4,60.4)*(1-P(t,62.6,63.4));
  if(cu>0){ctx.save();ctx.globalAlpha=A*cu;const ics=[[SX-300,GY-410,'공유된 가치',C.rose],[SX,GY-470,'함께 지키는 규범',C.violet],[SX+300,GY-410,'조직의 관행',C.green]];
    ics.forEach((c,i)=>{const bob=Math.sin(t*2+i)*8;const x=c[0],y=c[1]+bob;glow(x,y,90,c[3],.25);
      if(i===0){ctx.fillStyle=hex(c[3],.95);ctx.beginPath();ctx.moveTo(x,y+28);ctx.bezierCurveTo(x-60,y-18,x-24,y-52,x,y-22);ctx.bezierCurveTo(x+24,y-52,x+60,y-18,x,y+28);ctx.fill()}
      else if(i===1){ring(x-16,y,26,c[3],.95,5);ring(x+16,y,26,c[3],.95,5)}
      else{rr(x-24,y-32,48,64,8);ctx.strokeStyle=hex(c[3],.95);ctx.lineWidth=4;ctx.stroke();for(let l=0;l<3;l++)line(x-12,y-14+l*14,x+12,y-14+l*14,c[3],.9,3)}
      text(c[2],x,y+66,{size:26,col:C.fg})});ctx.restore()}
  const stp=O(t,61.2,62)*(1-P(t,62.8,63.6));if(stp>0){ctx.save();ctx.globalAlpha=A*stp;const x=SX+300,y=GY-410,s=2-stp;ctx.translate(x,y);ctx.rotate(-.18);ctx.scale(s,s);ring(0,0,64,C.rose,.95,6);ring(0,0,52,C.rose,.7,2);text('제도',0,2,{size:44,w:700,col:C.rose});ctx.restore()}
  ctx.restore();
  ctx.restore();
}

/* ---------- S5 순환 ---------- */
function S5(t,A){
  ctx.save();ctx.globalAlpha=A;
  const cx=960,cy=525,rx=560,ry=232;
  const nodes=[['생각',C.blue],['행동',C.amber],['습관·제도',C.green],['환경(물질)',C.teal],['경험',C.rose],['마음·감정',C.violet]];
  const pos=nodes.map((n,i)=>{const a=-Math.PI/2+i*TAU/6;return[cx+rx*Math.cos(a),cy+ry*Math.sin(a),a]});
  const arc=E(t,69.6,73.2);
  // 타원 궤도
  ctx.save();ctx.strokeStyle=hex(C.mut,.28);ctx.lineWidth=3;ctx.setLineDash([2,10]);ctx.lineCap='round';ctx.beginPath();ctx.ellipse(cx,cy,rx,ry,0,-Math.PI/2,-Math.PI/2+TAU*arc);ctx.stroke();ctx.restore();
  // 움직이는 빛
  const orb=P(t,72.4,77.8);if(orb>0){const a=-Math.PI/2+orb*TAU*1.6;const x=cx+rx*Math.cos(a),y=cy+ry*Math.sin(a);for(let k=1;k<26;k++){const aa=a-k*.028;dot(cx+rx*Math.cos(aa),cy+ry*Math.sin(aa),9-k*.3,C.white,.4*(1-k/26))}glow(x,y,70,C.white,.7);dot(x,y,9,C.white,1)}
  pos.forEach((p,i)=>{const a=O(t,69.8+i*.45,70.7+i*.45);if(a<=0)return;
    const on=orb>0?Math.pow(Math.max(0,Math.cos(((-Math.PI/2+orb*TAU*1.6)-p[2]))),8):0;
    pill(p[0],p[1],250,86,nodes[i][1],a,nodes[i][0],null,on,34);
    if(i===3&&a>.6){ // 환경: 작은 도시
      ctx.save();ctx.globalAlpha=A*a;[[-70,34],[-30,50],[12,28],[52,44]].forEach((b,k)=>{ctx.fillStyle=hex(C.teal,.55);ctx.fillRect(p[0]+b[0]-9,p[1]+70-b[1]*.6,18,b[1]*.6)});ctx.restore()}});
  // 잠깐! — 마음·감정 → 생각 사이
  const gp=win(t,74,74.8,77.2,78);if(gp>0){const a=-Math.PI/2-TAU/12,x=cx+rx*Math.cos(a)*1.0,y=cy+ry*Math.sin(a)*1.0;ctx.save();ctx.globalAlpha=A*gp;const pul=1+.08*Math.sin(t*6);glow(x,y-6,100*pul,C.amber,.3);rr(x-84,y-52,168,52,26);ctx.fillStyle=hex(C.amber,.95);ctx.fill();text('잠깐!',x,y-26,{size:30,w:700,col:'#2a1604'});ctx.restore()}
  text('개인과 사회는 하나의 순환입니다',cx,160,{size:58,w:700,font:SERIF,a:O(t,69.4,70.4)*(1-P(t,77,78))});
  text('사람이 시스템을 만들고, 시스템이 사람을 만든다',cx,cy,{size:34,col:C.mut,a:O(t,71.5,72.8)*(1-P(t,77,78))});
  ctx.restore();
}

/* ---------- S6 정직한 한계 · 열린 질문 ---------- */
function S6(t,A){
  ctx.save();ctx.globalAlpha=A;const cx=960;
  // 배경: 희미한 신경망
  HEAD.links.forEach(([i,j])=>{const a=HEAD.nodes[i],b=HEAD.nodes[j];line(a.x+0,a.y+60,b.x,b.y+60,C.teal,.05*A,1.5)});
  const s1=win(t,78.6,79.8,83.4,84.4),s2=win(t,84.2,85.4,87.2,88);
  glow(cx,540,520,C.teal,.08);
  if(s1>0){text('생각이 곧바로 물질을 움직이는 것은 아닙니다.',cx,420,{size:66,w:700,font:SERIF,a:s1});
    text('생각은 행동과 관계, 제도를 거쳐 세상을 바꿉니다.',cx,540,{size:44,col:C.teal,a:s1*P(t,79.6,80.8)});
    text('물질적 기반 → 생각 → 행동 → 환경, 그리고 다시 순환',cx,630,{size:30,col:C.mut,a:s1*P(t,80.6,81.8)})}
  if(s2>0){const q=1+.05*Math.sin(t*3);glow(cx,330,160*q,C.violet,.25*s2);text('?',cx,330,{size:200,w:700,font:SERIF,col:C.violet,a:s2});
    text('물질의 활동이 어떻게 주관적인 경험이 되는가',cx,560,{size:50,w:700,font:SERIF,a:s2});
    text('과학과 철학이 함께 묻는, 아직 열린 질문입니다.',cx,650,{size:36,col:C.mut,a:s2})}
  ctx.restore();
}

/* ---------- S7 마무리 ---------- */
function S7(t,A){
  ctx.save();ctx.globalAlpha=A;const cx=960,cy=430;
  const k=O(t,88,89.4);
  for(let i=0;i<3;i++){const ph=((t*.5+i/3)%1);ring(cx,cy-30,120+ph*300,C.teal,.35*(1-ph)*k,3)}
  glow(cx,cy-30,260,C.amber,.12*k);
  text('잠깐!',cx,cy-90,{size:150,w:700,font:SERIF,col:C.amber,a:k});text('진짜?',cx,cy+60,{size:150,w:700,font:SERIF,col:C.amber,a:k});
  text('순환의 어느 지점에서든, 생각의 틈을 열 수 있습니다.',cx,760,{size:48,w:700,font:SERIF,a:O(t,89.2,90.6)});
  text('《연결할 용기》  ·  잠깐! 진짜? 동행 앱',cx,850,{size:32,col:C.mut,a:O(t,90,91.2)});
  ctx.restore();
}

/* ---------- 프레임 ---------- */
function drawFrame(t){
  ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;bg(t);
  const fns=[S0,S1,S2,S3,S4,S5,S6,S7];
  fns.forEach((f,i)=>{const[a,b]=SCENES[i];if(t>=a-.01&&t<b+.01){const A=sa(t,i);if(A>0)f(t,A)}});
  chip(t);caption(t);brand(t);progress(t);
}
window.DURATION=DURATION;window.drawFrame=drawFrame;
window.frameData=(t,q=.95)=>{drawFrame(t);return cv.toDataURL('image/jpeg',q)};
window.stillData=t=>{drawFrame(t);return cv.toDataURL('image/png')};
Promise.all([
  document.fonts.load("400 30px 'Noto Sans KR'","가나다"),document.fonts.load("500 30px 'Noto Sans KR'","가나다"),document.fonts.load("700 30px 'Noto Sans KR'","가나다"),
  document.fonts.load("700 60px 'Gowun Batang'","가나다 ?")
]).then(()=>document.fonts.ready).then(()=>{window.READY=true;drawFrame(0)});
</script>
