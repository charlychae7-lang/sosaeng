<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>깊이 읽기 주제별 영상 (세로형)</title>
<link rel="stylesheet" href="node_modules/@fontsource/noto-sans-kr/korean-400.css">
<link rel="stylesheet" href="node_modules/@fontsource/noto-sans-kr/korean-500.css">
<link rel="stylesheet" href="node_modules/@fontsource/noto-sans-kr/korean-700.css">
<link rel="stylesheet" href="node_modules/@fontsource/noto-sans-kr/latin-400.css">
<link rel="stylesheet" href="node_modules/@fontsource/noto-sans-kr/latin-500.css">
<link rel="stylesheet" href="node_modules/@fontsource/noto-sans-kr/latin-700.css">
<link rel="stylesheet" href="node_modules/@fontsource/gowun-batang/korean-700.css">
<link rel="stylesheet" href="node_modules/@fontsource/gowun-batang/latin-700.css">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script src="topics-data.js"></script>
<script>
/* 깊이 읽기 주제별 세로형(9:16) 영상. ?id=N 으로 주제를 고릅니다. 모든 화면은 시간 t만으로 그려집니다. */
const W=1080,H=1920,cv=document.getElementById('c'),ctx=cv.getContext('2d');
const SANS="'Noto Sans KR',sans-serif", SERIF="'Gowun Batang','Noto Sans KR',serif";
const C={bg1:'#06100f',bg2:'#0c2428',fg:'#EAF2F3',mut:'#9FB6BC',teal:'#5FC7BF',amber:'#F0A55A',violet:'#B3A4F0',green:'#8ECAB0',rose:'#F28FA0',blue:'#6EB4F0',line:'#2B4A52',white:'#FFFFFF'};
const CX=540,CY=830;
const PAL=[C.teal,C.blue,C.violet,C.amber,C.rose,C.green];
/* ---------- 유틸 ---------- */
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const eio=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const eo=t=>1-Math.pow(1-t,3);
const P=(t,a,b)=>clamp((t-a)/(b-a));
const E=(t,a,b)=>eio(P(t,a,b));
const O=(t,a,b)=>eo(P(t,a,b));
const win=(t,a,b,c,d)=>P(t,a,b)*(1-P(t,c,d));
const TAU=Math.PI*2;
function rng(seed){let s=seed>>>0;return()=>{s=(s+0x6D2B79F5)>>>0;let t=s;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
function hex(c,a=1){const n=parseInt(c.slice(1),16);return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`}
function dot(x,y,r,col,a=1){ctx.fillStyle=hex(col,a);ctx.beginPath();ctx.arc(x,y,Math.max(0,r),0,TAU);ctx.fill()}
function ring(x,y,r,col,a=1,w=2){ctx.strokeStyle=hex(col,a);ctx.lineWidth=w;ctx.beginPath();ctx.arc(x,y,Math.max(0,r),0,TAU);ctx.stroke()}
function glow(x,y,r,col,a=1){if(r<=0||a<=0)return;const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,hex(col,a));g.addColorStop(1,hex(col,0));ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill()}
function line(x1,y1,x2,y2,col,a=1,w=2,cap='round'){ctx.strokeStyle=hex(col,a);ctx.lineWidth=w;ctx.lineCap=cap;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()}
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
function text(s,x,y,o={}){const{size=44,w=500,col=C.fg,a=1,align='center',font=SANS}=o;ctx.font=`${w} ${size}px ${font}`;ctx.textAlign=align;ctx.textBaseline='middle';ctx.letterSpacing='0px';ctx.fillStyle=hex(col,a);ctx.fillText(s,x,y)}
function tw(s,size,w=500,font=SANS){ctx.font=`${w} ${size}px ${font}`;ctx.letterSpacing='0px';return ctx.measureText(s).width}
function wrapLines(s,size,maxW,w=500,font=SANS){const words=s.split(' ');const out=[];let cur='';for(const wd of words){const test=cur?cur+' '+wd:wd;if(tw(test,size,w,font)>maxW&&cur){out.push(cur);cur=wd}else cur=test}if(cur)out.push(cur);return out}
function paraText(s,x,y,o){const{size=44,maxW=900,lh=1.45,w=500,font=SANS}=o;const ls=wrapLines(s,size,maxW,w,font);ls.forEach((l,i)=>text(l,x,y+(i-(ls.length-1)/2)*size*lh,o));return ls.length}
function pill(x,y,w,h,col,a,label,sub,hl=0,fs=34){
  ctx.save();ctx.globalAlpha*=a;
  if(hl>0)glow(x,y,w*.7,col,.25*hl);
  rr(x-w/2,y-h/2,w,h,h/2);ctx.fillStyle=hex(col,.14+.2*hl);ctx.fill();
  ctx.strokeStyle=hex(col,.65+.35*hl);ctx.lineWidth=2+2*hl;ctx.stroke();
  text(label,x,y-(sub?12:0),{size:fs,w:700});
  if(sub)text(sub,x,y+(fs>30?24:20),{size:fs>30?22:18,col:C.mut});
  ctx.restore();
}
function person(x,y,s,col,a,swing=0){
  ctx.save();ctx.globalAlpha*=a;ctx.strokeStyle=hex(col,1);ctx.fillStyle=hex(col,1);ctx.lineWidth=6*s;ctx.lineCap='round';
  const hy=y-86*s;ctx.beginPath();ctx.arc(x,hy,15*s,0,TAU);ctx.fill();
  ctx.beginPath();ctx.moveTo(x,hy+18*s);ctx.lineTo(x,y-34*s);ctx.stroke();
  const sw=Math.sin(swing)*14*s;
  ctx.beginPath();ctx.moveTo(x,y-34*s);ctx.lineTo(x-12*s+sw,y);ctx.moveTo(x,y-34*s);ctx.lineTo(x+12*s-sw,y);ctx.stroke();
  ctx.beginPath();ctx.moveTo(x,hy+30*s);ctx.lineTo(x-20*s-sw,y-46*s);ctx.moveTo(x,hy+30*s);ctx.lineTo(x+20*s+sw,y-46*s);ctx.stroke();ctx.restore();
}
const R1=rng(7);
const STARS=Array.from({length:90},()=>({x:R1()*W,y:R1()*H,r:.6+R1()*1.6,a:.25+R1()*.6,v:2+R1()*6,p:R1()*6}));
const DEN=(()=>{const r=rng(21),segs=[];function br(x,y,ang,len,depth,order){if(depth>3)return;const x2=x+Math.cos(ang)*len,y2=y+Math.sin(ang)*len;segs.push({x1:x,y1:y,x2,y2,order,w:depth===0?7:depth===1?5:3});for(let i=0;i<2;i++)br(x2,y2,ang+(i?1:-1)*(.35+r()*.5),len*(.68+r()*.1),depth+1,order+1)}
  [[Math.PI,110],[Math.PI*0.78,105],[Math.PI*1.22,105],[Math.PI*0.58,95],[Math.PI*1.42,95]].forEach(([a,l])=>br(520+Math.cos(a)*66,470+Math.sin(a)*66,a,l,0,0));return segs})();
/*HEAD*/

/* ---------- 주제 선택·시간표 ---------- */
const TID=+(new URLSearchParams(location.search).get('id')||1);
const T=TOPICS.find(x=>x.n===TID);
const TC=C[T.color];
const INTRO=3.5,BEAT=8,OUTRO=4.5;
const DURATION=INTRO+T.beats.length*BEAT+OUTRO;
const NB=T.beats.length;

/* ---------- 장면 템플릿 ---------- */
const MOT={};
const colOf=(x,d)=>typeof x==='string'?(C[x]||x):d;

MOT.zoom=(u,p)=>{const it=p.items,n=it.length;
  for(let i=0;i<n;i++){const r=400-i*(340/(n-1)),a0=.4+i*1.15,k=E(u,a0,a0+1.1);if(k<=0)continue;const c=PAL[i%PAL.length];
    dot(CX,CY,r*(.6+.4*k),c,.05*k);ring(CX,CY,r*(.6+.4*k),c,.8*k,3);
    const ang=u*(.5+i*.18)+i;dot(CX+Math.cos(ang)*r,CY+Math.sin(ang)*r,6,c,k);
    const lw=tw(it[i],32,700)+36;ctx.save();ctx.globalAlpha*=k;rr(CX-lw/2,CY-r-24,lw,48,24);ctx.fillStyle='rgba(6,16,15,.88)';ctx.fill();ctx.strokeStyle=hex(c,.7);ctx.lineWidth=2;ctx.stroke();text(it[i],CX,CY-r,{size:30,w:700,col:c});ctx.restore()}
  const pulse=1+.12*Math.sin(u*5);glow(CX,CY,70*pulse,C.white,.55*P(u,3,5));dot(CX,CY,8,C.white,P(u,3,5));
};
MOT.lattice=(u,p)=>{const cols=24,rows=24,sx=38,sy=33,x0=CX-(cols-1)*sx/2,y0=CY-(rows-1)*sy/2,bt=P(u,1.2,5);
  for(let j=0;j<rows;j++)for(let i=0;i<cols;i++){const x=x0+i*sx,y=y0+j*sy,d=Math.hypot(x-CX,y-CY);
    const wave=Math.sin(d*.02-u*3.2)*Math.exp(-d*.0018)*(1-.55*bt)*9,bump=Math.exp(-(d*d)/(2*Math.pow(90-55*bt,2)))*48*bt*(1+.12*Math.sin(u*7));
    const ang=Math.atan2(y-CY,x-CX),px=x+Math.cos(ang)*wave*.5,py=y+Math.sin(ang)*wave*.5-bump,br=clamp(.2+Math.abs(wave)/16+bump/48,0,1);dot(px,py,2+br*3.4,C.teal,.22+.7*br)}
  for(let k=0;k<3;k++){const rt=((u*.55+k/3)%1);ctx.strokeStyle=hex(C.teal,bt*(1-rt)*.5);ctx.lineWidth=2.2;ctx.beginPath();ctx.ellipse(CX,CY-22,60+rt*240,(60+rt*240)*.5,0,0,TAU);ctx.stroke()}
  glow(CX,CY-40*bt,100*bt+14,C.teal,.25+.7*bt);dot(CX,CY-44*bt,8+10*bt,C.white,bt);
  text('양자장',CX,1235,{size:40,w:700,a:P(u,.4,1.2)});text('입자 = 장이 들뜬 상태',CX,1290,{size:30,col:C.mut,a:P(u,4,5)});
};
MOT.atom=(u,p)=>{const s=.7+.3*O(u,0,1.5);glow(CX,CY,260*s,C.amber,.12);
  [[0,0],[18,6],[-16,10],[8,-18],[-10,-14],[20,-12],[-22,-4]].forEach((q,i)=>{dot(CX+q[0]*s*1.8,CY+q[1]*s*1.8,17*s,i%2?C.rose:C.amber);glow(CX+q[0]*s*1.8,CY+q[1]*s*1.8,34*s,i%2?C.rose:C.amber,.3)});
  for(let i=0;i<3;i++){const rot=i*Math.PI/3+u*.15;ctx.save();ctx.translate(CX,CY);ctx.rotate(rot);ctx.strokeStyle=hex(C.teal,.45);ctx.lineWidth=2.5;ctx.beginPath();ctx.ellipse(0,0,300*s,108*s,0,0,TAU);ctx.stroke();
    const a=u*(2.2+i*.5)+i*2,ex=Math.cos(a)*300*s,ey=Math.sin(a)*108*s;glow(ex,ey,40,C.teal,.6);dot(ex,ey,11,C.white);ctx.restore()}
  (p.tags||[]).forEach((t,i)=>{const a=O(u,3+i*1,4+i*1);pill(CX+(i?170:-170),1200,260,80,t[1]?C.teal:C.amber,a,t[0],null,0,36)});
};
MOT.emerge=(u,p)=>{const n=72,r=rng(11+(p.seed||0)),col=colOf(p.col,C.teal),k=E(u,2.6,5.4),shape=p.shape;
  const tgt=i=>{const f=i/(n-1);
    if(shape==='ring'){const a=f*TAU;return[CX+Math.cos(a)*(i%2?230:150),CY+Math.sin(a)*(i%2?230:150)]}
    if(shape==='drop'){const t=f*TAU,s=i%3?1:.55;return[CX+s*210*Math.sin(t)*Math.sin(t/2),CY+60-s*240*Math.cos(t)]}
    if(shape==='tower'){const c=i%6,rw=Math.floor(i/6);return[CX-165+c*66+33,CY+330-rw*34]}
    return[120+f*840,CY+110*Math.sin(f*TAU*2)]};
  for(let i=0;i<n;i++){const sx=100+r()*880,sy=480+r()*700,ph=r()*TAU,tg=tgt(i);
    const x=lerp(sx+Math.sin(u*1.2+ph)*22,tg[0],k),y=lerp(sy+Math.cos(u*1.1+ph)*22,tg[1],k);dot(x,y,8,col,.85);}
  const wa=P(u,5,6.2);glow(CX,CY+(shape==='tower'?60:20),300*wa,col,.2*wa);
  text(p.parts,CX,1265,{size:38,col:C.mut,a:1-P(u,2.6,3.4)});text(p.whole,CX,1265,{size:54,w:700,font:SERIF,col,a:wa});
};
MOT.cell=(u,p)=>{const m=p.mode,R=250,col=C.green;let amp=0;
  if(m==='basic')amp=10;
  if(m==='sense')amp=14*Math.max(0,Math.sin(u*2.8));
  const pts=[];for(let i=0;i<=72;i++){const a=i/72*TAU,w=1+(amp/R)*Math.sin(a*3+u*2)+(m==='basic'?.012*Math.sin(a*5-u*3):0);pts.push([CX+Math.cos(a)*R*w,CY+Math.sin(a)*R*w])}
  glow(CX,CY,R*1.5,col,.12);ctx.beginPath();pts.forEach((q,i)=>i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]));ctx.closePath();ctx.fillStyle=hex(col,.07);ctx.fill();ctx.strokeStyle=hex(C.blue,.9);ctx.lineWidth=6;ctx.stroke();
  for(let i=0;i<64;i++){const a=i/64*TAU+u*.05;dot(CX+Math.cos(a)*(R+6),CY+Math.sin(a)*(R+6),5,C.blue,.5)}
  glow(CX,CY,80,C.violet,.4);dot(CX,CY,46,C.violet,.55);ring(CX,CY,46,C.violet,.9,2);
  [[-120,-80],[130,-60],[-100,100],[110,110],[10,150]].forEach((q,i)=>{ctx.save();ctx.translate(CX+q[0],CY+q[1]);ctx.rotate(i+u*.2);ctx.fillStyle=hex(C.amber,.7);ctx.beginPath();ctx.ellipse(0,0,26,13,0,0,TAU);ctx.fill();ctx.restore()});
  if(m==='exchange'){for(let i=0;i<16;i++){const ph=((u*.35+i/16)%1),a=i/16*TAU+.3;
      const rin=lerp(R+130,R-40,ph),rout=lerp(R-40,R+130,ph);
      if(i%2){dot(CX+Math.cos(a)*rin,CY+Math.sin(a)*rin,8,C.amber,Math.sin(ph*Math.PI))}else dot(CX+Math.cos(a)*rout,CY+Math.sin(a)*rout,8,C.blue,Math.sin(ph*Math.PI))}
    text('에너지·물질 ↓ 들어옴',CX-170,CY-R-120,{size:30,col:C.amber,a:O(u,1,2)});text('내보냄 ↑',CX+210,CY-R-120,{size:30,col:C.blue,a:O(u,2,3)});}
  if(m==='sense'){for(let k=0;k<4;k++){const ph=((u*.45+k/4)%1);ctx.strokeStyle=hex(C.rose,.6*(1-ph));ctx.lineWidth=3;ctx.beginPath();ctx.arc(60,CY,40+ph*520,-1,1);ctx.stroke()}
    dot(60,CY,14,C.rose);text('자극',60,CY-50,{size:30,col:C.rose});
    const fl=Math.pow(.5+.5*Math.sin(u*2.8),2);for(let i=0;i<5;i++){const a=Math.PI+(i-2)*.22;glow(CX+Math.cos(a)*R,CY+Math.sin(a)*R,36,C.rose,.7*fl);dot(CX+Math.cos(a)*R,CY+Math.sin(a)*R,8,C.rose,.5+.5*fl)}
    text('수용체가 감지',CX-100,CY+R+80,{size:30,col:C.mut,a:O(u,2,3)})}
  if(m==='keep'){text('균형',CX,CY+R+90,{size:36,w:700,col:C.green,a:P(u,1,2)})}
  if(m==='basic'){text('에너지 · 감지 · 유지',CX,CY+R+90,{size:34,col:C.mut,a:O(u,1.5,2.5)})}
  if(m==='sense'){/* 감지 후 균형 복원 */text('감지하고,',CX+120,CY+R+80,{size:30,col:C.mut,a:P(u,3.5,4.5)});}
};
MOT.neuron=(u,p)=>{const m=p.mode;ctx.save();ctx.translate(CX,570);ctx.rotate(Math.PI/2);ctx.scale(.6,.6);ctx.translate(-520,-470);
  DEN.forEach(s=>line(s.x1,s.y1,s.x2,s.y2,C.teal,.8,s.w));
  glow(520,470,150,C.teal,.28);dot(520,470,66,C.teal,.35);ring(520,470,66,C.teal,.95,5);dot(520,470,26,C.violet,.8);
  line(586,470,1148,470,C.teal,.9,9);for(let i=0;i<5;i++){rr(660+i*92,470-17,60,34,15);ctx.fillStyle=hex(C.blue,.35);ctx.fill();ctx.strokeStyle=hex(C.blue,.8);ctx.lineWidth=2;ctx.stroke()}
  dot(1160,470,20,C.teal,.95);ring(1160,470,20,C.white,.6,2);
  line(1352,470,1498,470,C.teal,.85,8);[-.5,.5].forEach(d=>line(1352,470,1292,470+Math.sin(d)*70,C.teal,.8,5));
  glow(1560,470,130,C.teal,.22);dot(1560,470,62,C.teal,.3);ring(1560,470,62,C.teal,.9,5);dot(1560,470,24,C.violet,.8);
  const per=m==='electric'?2.6:5.2,ph=(u%per)/per;
  const pp=m==='electric'?P(ph,0,.7):P(ph,0,.4);
  if(pp>0&&pp<1){const px=lerp(590,1150,pp),g=ctx.createLinearGradient(px-200,0,px,0);g.addColorStop(0,hex(C.white,0));g.addColorStop(1,hex(C.white,.95));ctx.strokeStyle=g;ctx.lineWidth=11;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(Math.max(590,px-200),470);ctx.lineTo(px,470);ctx.stroke();glow(px,470,80,C.white,.9);glow(px,470,160,C.teal,.35)}
  if(m==='chem'){const vs=P(ph,.4,.8);if(vs>0&&vs<1)for(let i=0;i<20;i++){const r=rng(300+i),d=r()*.4,k=clamp((vs-d)/(1-d));if(k<=0||k>=1)continue;const y=470+(r()-.5)*60*(.4+k)+Math.sin(u*5+i)*6;dot(lerp(1175,1345,eo(k)),y,5+r()*3,C.amber,1-P(k,.85,1));glow(lerp(1175,1345,eo(k)),y,18,C.amber,.35)}
    const lit=P(ph,.78,.9)*(1-P(ph,.9,1));if(lit>0)glow(1560,470,220*lit,C.white,.45)}
  ctx.restore();
  if(p.l1)text(p.l1,CX+110,810,{size:44,w:700,col:C.white,a:m==='chem'?.45:1,align:'left'});
  if(p.l2){text(p.l2,CX+110,1010,{size:44,w:700,col:C.amber,a:O(u,1,2),align:'left'});text(p.l2s,CX+110,1060,{size:30,col:C.mut,a:O(u,1,2),align:'left'})}
};
MOT.network=(u,p)=>{const r=rng(31),N=28,nd=[];for(let i=0;i<N;i++){const a=r()*TAU,d=Math.sqrt(r())*(i<N?1:1);nd.push({x:CX+Math.cos(a)*d*400,y:CY+Math.sin(a)*d*380})}
  const sel=p.sel||0;const links=[];nd.forEach((a,i)=>{const ds=nd.map((b,j)=>[Math.hypot(a.x-b.x,a.y-b.y),j]).sort((x,y)=>x[0]-y[0]).slice(1,4);ds.forEach(d=>{if(d[1]>i)links.push([i,d[1]])})});
  const org=nd[0],per=5,ph=(u%per);
  const act=n=>{const d=Math.hypot(n.x-org.x,n.y-org.y)/220;return clamp(1-Math.abs(ph*1.0-d)*1.2,0,1)};
  links.forEach(([i,j])=>{const a=nd[i],b=nd[j];const k=Math.max(act(a),act(b));line(a.x,a.y,b.x,b.y,C.teal,.3+.55*k,2+2.5*k)});
  nd.forEach(n=>{const k=act(n);dot(n.x,n.y,9+8*k,C.teal,.65+.35*k);if(k>.3)glow(n.x,n.y,40,C.white,.35*k)});
};
MOT.brain=(u,p)=>{const dr=E(u,.2,3),gA=P(u,1,3);ctx.save();ctx.translate(CX,CY);ctx.scale(1.4,1.4);ctx.translate(-1030,-535);
  ctx.save();ctx.setLineDash([3400,3400]);ctx.lineDashOffset=3400*(1-dr);ctx.strokeStyle=hex(C.teal,.9);ctx.lineWidth=5;ctx.lineJoin='round';ctx.stroke(HEAD.path);ctx.restore();
  glow(1010,470,380,C.teal,.10*gA);
  HEAD.links.forEach(([i,j])=>{const a=HEAD.nodes[i],b=HEAD.nodes[j],act=.5+.5*Math.sin(u*3+a.p+b.p);line(a.x,a.y,b.x,b.y,C.teal,gA*(.12+.28*act),1.6)});
  HEAD.nodes.forEach(n=>{const act=Math.pow(.5+.5*Math.sin(u*3.4+n.p*3),3);dot(n.x,n.y,n.s*3+act*4,C.teal,gA*(.4+.5*act));if(act>.55)glow(n.x,n.y,26,C.white,.4*act*gA)});ctx.restore();
};
MOT.chain=(u,p)=>{const it=p.items,n=it.length,gap=Math.min(150,780/n),y0=CY-(n-1)*gap/2,w=p.w||680,h=Math.min(96,gap-28),fs=n>5?34:38;

  if(t<INTRO)intro(t);
  T.beats.forEach((b,k)=>{const u=t-(INTRO+k*BEAT);if(u<-.01||u>=BEAT+.01)return;const A=win(u,0,.6,BEAT-.6,BEAT);if(A<=0)return;
    ctx.save();ctx.globalAlpha=A;paraText(b.h,CX,285,{size:56,w:700,font:SERIF,maxW:920,lh:1.3});MOT[b.m](u,b.p||{});ctx.restore()});
  if(t>=DURATION-OUTRO)outro(t);
  chip(t);caption(t);brand(t);progress(t);
}
window.DURATION=DURATION;window.drawFrame=drawFrame;
window.frameData=(t,q=.95)=>{drawFrame(t);return cv.toDataURL('image/jpeg',q)};
window.stillData=t=>{drawFrame(t);return cv.toDataURL('image/png')};
Promise.all([
  document.fonts.load("400 30px 'Noto Sans KR'","가나다"),document.fonts.load("500 30px 'Noto Sans KR'","가나다"),document.fonts.load("700 30px 'Noto Sans KR'","가나다"),
  document.fonts.load("700 60px 'Gowun Batang'","가나다 ?")
]).then(()=>document.fonts.ready).then(()=>{window.READY=true;drawFrame(0)});
</script>
